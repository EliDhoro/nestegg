/* ---------- what you buy: everything comes from the items kept on scanned receipts ---------- */
function purchases(){

        var label = x.p || x.n, key = itemKey(label), a = +x.a || 0, each = round2(a / (+x.q || 1)); if (!key || !(a > 0)) return;
        var e = items[key] = items[key] || {key:key, name:label, cat:t.categoryId, total:0, times:0, buys:[], last:''};
        count++; e.total = round2(e.total + a); e.times++; e.buys.push({date:t.date, shop:(t.note || '').trim(), a:each, qty:+x.q || 1, exact:wordsIn(label).toUpperCase()});
        if (t.date >= e.last) { e.last = t.date; e.name = label; }
        if (!first || t.date < first) first = t.date;
      });
    });
    var list = Object.keys(items).map(function(k){ return items[k]; }).sort(function(a, b){ return b.total - a.total; });
    var months = first ? Math.max(1, (daysBetween(first, todayStr()) + 1) / 30.4) : 1, gaps = [], rises = [];
    list.forEach(function(e){
      // the same item, same size (the words and numbers on the slip must match), at different shops or over time
      var same = {}; e.buys.forEach(function(b){ (same[b.exact] = same[b.exact] || []).push(b); });
      Object.keys(same).forEach(function(k){
        var buys = same[k], shops = {};
        buys.forEach(function(b){ if (b.shop) (shops[b.shop] = shops[b.shop] || []).push(b.a); });
        var names = Object.keys(shops);
        if (names.length > 1) {
          var ps = names.map(function(n){ return {shop:n, price:median(shops[n])}; }).sort(function(a, b){ return a.price - b.price; }), lo = ps[0], hi = ps[ps.length - 1], d = round2(hi.price - lo.price);
          var worth = round2(d * buys.filter(function(b){ return b.shop !== lo.shop; }).length / months);
          if (d >= 2 && d / hi.price >= 0.05 && worth >= 2) gaps.push({name:e.name, cheap:lo.shop, price:lo.price, dear:hi.shop, dearPrice:hi.price, saves:worth});
        }
        buys.sort(function(a, b){ return a.date < b.date ? -1 : 1; });
        var at = buys[buys.length - 1], before = buys.slice(0, -1).filter(function(b){ return b.shop === at.shop; }).map(function(b){ return b.a; });
        if (before.length && at.a >= median(before) * 1.1 && at.a - median(before) >= 2) rises.push({name:e.name, shop:at.shop, was:median(before), now:at.a});

    live('tx').forEach(function(t){

      var n = (t.note || 'Other').trim(), s = shops[n] = shops[n] || {name:n, total:0, visits:{}}; s.total = round2(s.total + (+t.amount || 0)); s.visits[t.splitId || t.id] = 1;
    });
    return {items:list, gaps:gaps, rises:rises, count:count, slips:Object.keys(slips).length, scanned:round2(scanned), months:months, groceries:round2(groceries),

  });
}

// What's really going in each month, from the last three months of saving to this goal
function goalRate(g){
  var t = todayStr(), saves = live('tx').filter(function(x){ return x.type === 'saving' && x.goalId === g.id; }); if (!saves.length) return 0;
  var first = saves.reduce(function(a, x){ return x.date < a ? x.date : a; }, t), span = Math.max(1, Math.min(3, Math.ceil((daysBetween(first, t) + 1) / 30.4)));
  return Math.round(sum(saves.filter(function(x){ return x.date >= addDays(t, -91); }), function(x){ return x.amount; }) / span);
}
function goalEffect(g, add){
  // budget months, the same way goalPace counts them: this month's payment is the first
  var left = round2(g.target - goalSaved(g.id)), rate = goalRate(g), before = rate > 0 ? Math.ceil(left / rate) : null, after = rate + add > 0 ? Math.ceil(left / (rate + add)) : null, cur = periodKeyFor(currentPeriod());
  return {g:g, add:add, left:left, rate:rate, before:before, after:after, sooner:before && after ? before - after : null, on:after ? shiftKey(cur, after - 1) : null, was:before ? shiftKey(cur, before - 1) : null};
}
// Dated goals first, each up to what keeps it on time; whatever remains goes to the next goal. "All here" sends it to one goal.
function goalShares(saves, focus){
  var pool = Math.floor(saves / 10) * 10, goals = goalsOpen(), out = {};
  if (focus && goals.some(function(g){ return g.id === focus; })) { out[focus] = pool; pool = 0; }
  goals.slice().sort(function(a, b){ return (a.targetDate || '9999') < (b.targetDate || '9999') ? -1 : 1; }).forEach(function(g){
    if (!pool) return;
    var pace = goalPace(g), need = pace && !pace.late ? Math.max(0, pace.need - goalRate(g)) : 0, give = Math.min(pool, need);
    if (give) { out[g.id] = give; pool -= give; }
  });
  if (pool && goals.length) { var last = goals.filter(function(g){ return !g.targetDate; })[0] || goals[0]; out[last.id] = (out[last.id] || 0) + pool; }
  return out;
}
function goalLine(e){
  var g = e.g, late = g.targetDate && e.on && e.on > periodKeyFor(g.targetDate), date = late ? ' Still after your ' + fmtDate(g.targetDate, true) + ' date.' : '', by = g.targetDate && !late ? 'in time for ' + fmtDate(g.targetDate, true) : e.on ? keyName(e.on) : '';
  if (!e.after) return 'Nothing is going in yet, so it won\'t be reached at this rate.';
  var when = 'Reached ' + by;
  if (e.add > 0 && e.sooner > 0) return when + ' instead of ' + keyName(e.was) + ': ' + e.sooner + ' month' + (e.sooner === 1 ? '' : 's') + ' sooner.' + date;
  if (e.add > 0 && e.before === null) return 'Nothing is going in now. This reaches it in ' + e.after + ' month' + (e.after === 1 ? '' : 's') + ', ' + (g.targetDate && !late ? by : 'by ' + by) + '.' + date;
  return when + ' at your current ' + fmtR(e.rate) + ' a month.' + date;
}
ACTIONS.smartFocus = function(el){ var id = el.getAttribute('data-id'); ui.smartFocus = ui.smartFocus === id ? null : id; render(true); };
function whyCard(m){
  var cuts = m.rows.filter(function(r){ return r.save > 0; }).sort(function(a, b){ return b.save - a.save; }), goals = goalsOpen(), shares = goalShares(m.saves, ui.smartFocus);
  var html = '<div class="card" id="smart-why"><h2>What this does for you</h2>' +
    (cuts.length ? '<p class="small">Cutting back on ' + esc(cuts.slice(0, 4).map(function(r){ return r.c.name + ' (' + fmtR(r.save) + ')'; }).join(', ')) + (cuts.length > 4 ? ' and ' + (cuts.length - 4) + ' more' : '') +
      ' frees <b>' + fmtR(m.saves) + ' a month</b>, which is ' + fmtR(m.saves * 12) + ' a year.</p>' : '');
  if (!goals.length) return html + '<p class="small muted">Name something you\'re saving for and Nestegg shows how much sooner this gets you there.</p><button class="btn block" data-act="editGoal" data-id="">+ Add a goal</button></div>';
  return html + goals.map(function(g){
    var e = goalEffect(g, shares[g.id] || 0), on = ui.smartFocus === g.id;
    return '<div class="li" style="align-items:flex-start" id="smart-goal-' + g.id + '"><div class="ico">' + esc(g.emoji || '🎯') + '</div><div class="main"><div class="t">' + esc(g.name) + '</div><div class="s" style="white-space:normal">' + (e.add > 0 ? '<b>Add ' + fmtR(e.add) + ' a month.</b> ' : '') + esc(goalLine(e)) + '</div>' +
      '<div class="tiny muted">' + fmtR(e.left) + ' still to go</div></div>' + (goals.length > 1 ? '<button class="btn sm ghost" style="flex:none" data-act="smartFocus" data-id="' + g.id + '">' + (on ? 'Share it' : 'All here') + '</button>' : '') + '</div>';
  }).join('') + '<p class="tiny muted">Counted from what you\'ve saved to each goal lately, plus these savings. It only happens if you keep to the plan and move the money.</p></div>';
}
// On the Wealth tab, once a plan is in use
function smartGoalLine(g){
  var s = state.household.smart, add = s && s.goals && s.goals[g.id];
  if (!add || g.reachedOn) return '';
  return '<div class="small" style="margin-top:6px">🧠 Smart budget: add <b>' + fmtR(add) + '</b> a month. ' + esc(goalLine(goalEffect(g, add))) + '</div>';
}

/* ---------- the price book: everything your slips say about prices ---------- */
function shopPrices(e){
  var shops = {}; e.buys.forEach(function(b){ var n = b.shop || 'Unknown shop'; (shops[n] = shops[n] || []).push(b.a); });
  return Object.keys(shops).map(function(n){ return {shop:n, price:median(shops[n]), times:shops[n].length}; }).sort(function(a, b){ return a.price - b.price; });
}
ACTIONS.smartItem = function(el){ openSheet('itemPrices', {key:el.getAttribute('data-id')}); };

function priceRows(q){

      '<div style="text-align:right;flex:none"><div class="strong">' + fmtM(b.price) + '</div><div class="tiny muted">' + esc(b.shop) + '</div></div></div>';

/* ===== Nestegg — Google Drive sync (free; your own Drive; no server) ===== */
var Drive = {
  SCOPE: 'https://www.googleapis.com/auth/drive.file',
  clientId: function(){ return (device.clientId || CONFIG.GOOGLE_CLIENT_ID || '').trim(); },
  redirectUri: function(){ return location.origin + location.pathname.replace(/index\.html$/, ''); },
  tokenValid: function(){ return !!device.token && device.tokenExp > now() + 60000; },
  signIn: function(silent){
    if (!this.clientId()) { toast('Add your Google Client ID in Settings first'); return; }
    if (location.protocol !== 'https:' && location.hostname !== 'localhost') { toast('Sync needs the app to be opened from its web address (https)'); return; }
    var st = uid();
    try { sessionStorage.setItem('nestegg-oauth-state', st); localStorage.setItem('nestegg-oauth-state', st); } catch(e){}
    var p = {client_id:this.clientId(), redirect_uri:this.redirectUri(), response_type:'token', scope:this.SCOPE, include_granted_scopes:'true', state:st + (silent ? '.s' : '')};
    if (silent) p.prompt = 'none';
    if (device.driveEmail) p.login_hint = device.driveEmail;
    location.href = 'https://accounts.google.com/o/oauth2/v2/auth?' + Object.keys(p).map(function(k){ return k + '=' + encodeURIComponent(p[k]); }).join('&');
  },
  handleRedirect: function(){
    var h = location.hash;
    if (!h || (h.indexOf('access_token=') < 0 && h.indexOf('error=') < 0)) return null;
    var q = {}; h.slice(1).split('&').forEach(function(kv){ var i = kv.indexOf('='); q[decodeURIComponent(kv.slice(0, i))] = decodeURIComponent(kv.slice(i+1).replace(/\+/g, ' ')); });
    try { history.replaceState(null, '', location.pathname + location.search); } catch(e){ location.hash = ''; }
    var saved = null; try { saved = sessionStorage.getItem('nestegg-oauth-state') || localStorage.getItem('nestegg-oauth-state'); } catch(e){}
    var st = (q.state || '').replace(/\.s$/, ''), silent = /\.s$/.test(q.state || '');
    if (saved && st !== saved) { device.syncError = 'Sign-in check failed — please try again.'; saveDevice(); return 'error'; }
    if (q.error) { if (!silent) { device.syncError = 'Google sign-in was cancelled or blocked (' + q.error + ').'; } saveDevice(); return silent ? 'silent-fail' : 'error'; }
    device.token = q.access_token; device.tokenExp = now() + (parseInt(q.expires_in, 10) || 3600) * 1000; device.syncError = '';
    saveDevice(); return 'ok';
  },
  api: function(url, opts){
    opts = opts || {}; opts.headers = Object.assign({Authorization:'Bearer ' + device.token}, opts.headers || {});
    return fetch(url, opts).then(function(r){
      if (r.status === 401) { device.token = null; device.tokenExp = 0; saveDevice(); var e = new Error('auth'); e.auth = true; throw e; }
      if (!r.ok) return r.text().then(function(t){ throw new Error('Drive error ' + r.status + ': ' + t.slice(0, 160)); });
      return r;
    });
  },
  findFile: function(){
    var self = this;
    if (device.driveFileId) {
      return this.api('https://www.googleapis.com/drive/v3/files/' + device.driveFileId + '?fields=id,trashed').then(function(r){ return r.json(); })
        .then(function(f){ return f.trashed ? self.search() : f.id; }).catch(function(e){ if (e.auth) throw e; return self.search(); });
    }
    return this.search();
  },
  search: function(){
    var q = encodeURIComponent("name='" + CONFIG.DATA_FILE + "' and trashed=false");
    return this.api('https://www.googleapis.com/drive/v3/files?q=' + q + '&spaces=drive&orderBy=modifiedTime%20desc&fields=files(id,modifiedTime)').then(function(r){ return r.json(); })
      .then(function(j){ return j.files && j.files.length ? j.files[0].id : null; });
  },
  download: function(id){ return this.api('https://www.googleapis.com/drive/v3/files/' + id + '?alt=media').then(function(r){ return r.text(); }); },
  create: function(text){
    var b = 'nestegg' + uid(), meta = {name:CONFIG.DATA_FILE, mimeType:'application/json', description:'Nestegg household budget data. Do not edit by hand.'};
    var body = '--' + b + '\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n' + JSON.stringify(meta) + '\r\n--' + b + '\r\nContent-Type: application/json\r\n\r\n' + text + '\r\n--' + b + '--';
    return this.api('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id', {method:'POST', headers:{'Content-Type':'multipart/related; boundary=' + b}, body:body})
      .then(function(r){ return r.json(); }).then(function(j){ return j.id; });
  },
  update: function(id, text){
    return this.api('https://www.googleapis.com/upload/drive/v3/files/' + id + '?uploadType=media', {method:'PATCH', headers:{'Content-Type':'application/json'}, body:text});
  }
};

/* ---------- automatic sync: a small Apps Script in the household's own Google account ---------- */
// Google sign-ins from a web page only last an hour, so syncing straight to Drive kept stopping. Instead the household
// deploys this script (free) once; it keeps the data file in their Drive and serves it to devices that know the key.
// No device signs in to Google again. `rev` goes up with every save, and a save based on an old rev is refused,
// so a device that missed something merges first and tries again — nobody's changes get overwritten.
var SCRIPT_VERSION = 4; // the newest RELAY_SCRIPT; keep in step with its VERSION line
// Gemini models to try, newest first; sent with each request so a renamed model only needs an app update
var AI_MODELS = ['gemini-flash-latest', 'gemini-3.8-flash', 'gemini-2.5-flash'];
var RELAY_SCRIPT = [
  '// Nestegg sync. Runs in your own Google account, free. Paste ALL of this into a new Apps Script project.',
  "var KEY = '%KEY%';",
  "var FILE = 'nestegg-household-data.json';",
  'var VERSION = 4;',
  '',
  'function doGet(e) { return reply({ok: true, nestegg: true, version: VERSION}); }',
  'function doPost(e) { var p = {}; try { p = JSON.parse(e.postData.contents); } catch (x) {} var out = handle(p); out.version = VERSION; return reply(out); }',
  '',
  'function handle(p) {',
  "  if (p.key !== KEY) return {ok: false, error: 'bad-key'};",
  "  if (p.action === 'ping') return {ok: true, ai: !!PropertiesService.getScriptProperties().getProperty('gemini')};",
  "  if (p.action === 'ocr') return readReceipt(p);",
  "  if (p.action === 'setGemini') return setGemini(p);",
  '  var lock = LockService.getScriptLock(); lock.waitLock(20000);',
  '  try {',
  "    var props = PropertiesService.getScriptProperties(), rev = Number(props.getProperty('rev') || 0), file = dataFile(props);",
  "    if (p.action === 'put') {",
  "      if (Number(p.base) !== rev) return {ok: false, error: 'conflict', rev: rev};",
  "      file.setContent(p.data); rev++; props.setProperty('rev', String(rev));",
  '      return {ok: true, rev: rev};',
  '    }',
  '    if (p.since !== null && p.since !== undefined && Number(p.since) === rev) return {ok: true, rev: rev, same: true};',
  '    return {ok: true, rev: rev, data: file.getBlob().getDataAsString()};',
  '  } finally { lock.releaseLock(); }',
  '}',
  '',
  '// Uses the file Nestegg already saved in this Drive, or makes a new one',
  'function dataFile(props) {',
  "  var id = props.getProperty('file');",
  '  if (id) { try { var f = DriveApp.getFileById(id); if (!f.isTrashed()) return f; } catch (x) {} }',
  '  var it = DriveApp.getFilesByName(FILE), best = null;',
  '  while (it.hasNext()) { var g = it.next(); if (!g.isTrashed() && (!best || g.getLastUpdated() > best.getLastUpdated())) best = g; }',
  "  if (!best) best = DriveApp.createFile(FILE, '');",
  "  props.setProperty('file', best.getId());",
  '  return best;',
  '}',
  '',
  '// Receipt photos: Google\'s Gemini AI reads the slip when an AI key is saved; otherwise (or if that fails)',
  '// Google Drive reads the text into a temporary Doc, which is deleted straight away',
  'function readReceipt(p) {',
  "  var k = PropertiesService.getScriptProperties().getProperty('gemini'), ai = null;",
  '  if (k && p.prompt) {',
  "    var a = askGemini(k, [{text: p.prompt}, {inline_data: {mime_type: p.mime || 'image/jpeg', data: p.image}}], p.models);",
  '    if (a.json && a.json.items && a.json.items.length) return {ok: true, ai: a.json};',
  "    ai = {error: a.error || 'no items'};",
  '  }',
  '  var t = readText(p); t.ai = ai; return t;',
  '}',
  '',
  'function readText(p) {',
  "  var b = 'nestegg' + Date.now(), auth = {Authorization: 'Bearer ' + ScriptApp.getOAuthToken()};",
  "  var meta = JSON.stringify({name: 'nestegg-receipt', mimeType: 'application/vnd.google-apps.document'});",
  "  var head = '--' + b + '\\r\\nContent-Type: application/json; charset=UTF-8\\r\\n\\r\\n' + meta + '\\r\\n--' + b + '\\r\\nContent-Type: ' + (p.mime || 'image/jpeg') + '\\r\\n\\r\\n';",
  "  var body = Utilities.newBlob(head).getBytes().concat(Utilities.base64Decode(p.image)).concat(Utilities.newBlob('\\r\\n--' + b + '--').getBytes());",
  "  var up = UrlFetchApp.fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&ocrLanguage=en', {method: 'post', contentType: 'multipart/related; boundary=' + b, payload: body, headers: auth, muteHttpExceptions: true});",
  "  if (up.getResponseCode() >= 300) return {ok: false, error: 'ocr-failed', detail: up.getContentText().slice(0, 300)};",
  '  var id = JSON.parse(up.getContentText()).id;',
  '  try {',
  "    return {ok: true, text: UrlFetchApp.fetch('https://www.googleapis.com/drive/v3/files/' + id + '/export?mimeType=text/plain', {headers: auth}).getContentText()};",
  "  } finally { UrlFetchApp.fetch('https://www.googleapis.com/drive/v3/files/' + id, {method: 'delete', headers: auth, muteHttpExceptions: true}); }",
  '}',
  '',
  '// The free Gemini AI key is kept here in the script, never in the app. Checked with a tiny question before it\'s saved.',
  'function setGemini(p) {',
  "  var k = String(p.gemini || '').trim(), props = PropertiesService.getScriptProperties();",
  "  if (!k) { props.deleteProperty('gemini'); return {ok: true, ai: false}; }",
  "  var test = askGemini(k, [{text: 'Reply with this JSON: {\"ok\": true}'}], p.models);",
  "  if (test.error) return {ok: false, error: 'gemini', detail: test.error};",
  "  props.setProperty('gemini', k); return {ok: true, ai: true};",
  '}',
  '',
  '// The key goes in a header, as Google documents (newer "AQ." keys need that); the app says which models to try',
  'function askGemini(k, parts, models) {',
  "  models = models && models.length ? models : ['gemini-flash-latest', 'gemini-2.5-flash']; var last = '';",
  '  for (var i = 0; i < models.length; i++) {',
  "    var r = UrlFetchApp.fetch('https://generativelanguage.googleapis.com/v1beta/models/' + models[i] + ':generateContent', {method: 'post',",
  "      contentType: 'application/json', headers: {'x-goog-api-key': k}, muteHttpExceptions: true, payload: JSON.stringify({contents: [{parts: parts}], generationConfig: {responseMimeType: 'application/json', temperature: 0}})});",
  '    var code = r.getResponseCode(), body = r.getContentText();',
  "    if (code === 404) { last = models[i] + ' is not available'; continue; }",
  "    if (code >= 300) { try { return {error: JSON.parse(body).error.message}; } catch (x) { return {error: 'HTTP ' + code}; } }",
  "    try { return {json: JSON.parse(JSON.parse(body).candidates[0].content.parts[0].text)}; } catch (x) { return {error: 'The AI gave an answer Nestegg could not read'}; }",
  '  }',
  '  return {error: last};',
  '}',
  '',
  '// Run this once from the editor (pick "authorize" next to Run, then press Run) so Google asks you to allow reading receipts',
  "function authorize() { DriveApp.getRootFolder(); UrlFetchApp.fetch('https://www.google.com'); }",
  '',
  'function reply(o) { return ContentService.createTextOutput(JSON.stringify(o)).setMimeType(ContentService.MimeType.JSON); }'
].join('\n');

var Relay = {
  ready: function(){ return !!(device.relayUrl && device.relayKey); },
  newKey: function(){
    var a = new Uint8Array(18); (window.crypto || window.msCrypto).getRandomValues(a);
    return Array.prototype.map.call(a, function(b){ return ('0' + b.toString(16)).slice(-2); }).join('');
  },
  // personal accounts: /macros/s/…/exec; Google Workspace (work/school) accounts: /a/macros/<domain>/s/…/exec
  validUrl: function(u){ return /^https:\/\/script\.google\.com\/(macros|a\/macros\/[^\/]+|a\/[^\/]+\/macros)\/s\/[\w-]+\/exec$/.test(u); },
  // Everything goes in a POST body (the key never sits in a URL). text/plain keeps it a "simple" request, which Apps Script allows.
  call: function(body, url){
    body.key = body.key || device.relayKey;
    return fetch(url || device.relayUrl, {method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body:JSON.stringify(body)})
      .then(function(r){ return r.text(); }, function(){ var e = new Error('No connection right now — it will sync when you\'re back online.'); e.offline = true; throw e; })
      .then(function(t){
        var j; try { j = JSON.parse(t); } catch(x){ throw new Error(scriptPageProblem(t)); }
        if (j.error === 'bad-key') throw new Error('This device\'s sync code doesn\'t match the script. Ask for a fresh join code.');
        var v = +j.version || 1; if (device.relayVersion !== v) { device.relayVersion = v; saveDevice(); } // receipt reading needs 2, AI 3
        if ('ai' in j && typeof j.ai === 'boolean' && device.aiOn !== j.ai) { device.aiOn = j.ai; saveDevice(); }
        return j;
      });
  },
  // A receipt photo (base64 JPEG) for Google to read; an older script answers without a version and gets an update prompt
  // Returns {text} from Google's text reading, and {ai} when the script's Gemini AI read it (version 3 with a key)
  ocr: function(b64, prompt){
    return this.call({action:'ocr', image:b64, mime:'image/jpeg', prompt:prompt || null, models:AI_MODELS}).then(function(j){
      if (!(+j.version >= 2)) { var e = new Error('The sync script needs a quick update to read receipts.'); e.needsUpdate = true; throw e; }
      if (!j.ok) throw new Error(j.error === 'ocr-failed' ? 'Google couldn\'t read that photo' + (/insufficient|scope|permission|auth/i.test(j.detail || '') ? ' — the script still needs your permission (step 3 of the update).' : '. Try again with the slip flat and well lit.') : 'Receipt reading problem: ' + (j.error || 'unknown'));
      return j;
    });
  },
  pull: function(since){ return this.call({action:'get', since: since == null ? null : since}); },
  push: function(base, text){ return this.call({action:'put', base:base, data:text}); },
  joinCode: function(){ return 'NEST1:' + btoa(device.relayUrl + ' ' + device.relayKey); },

};

  var r = null; rewardHistory().forEach(function(x){ if (x.start === sh.p) r = x; });
  var s = periodSummary(sh.p), pts = pointsFor(sh.p);
  return '<h2>🌅 ' + esc(periodName(sh.p)) + ' wrapped</h2><p class="muted">New month, fresh start. Here\'s how last month went:</p>' +
    '<div class="kpis"><div class="kpi"><div class="l">Income</div><div class="v">' + fmtR(s.income) + '</div></div><div class="kpi"><div class="l">Spent</div><div class="v">' + fmtR(s.spent) + '</div></div><div class="kpi"><div class="l">Saved</div><div class="v">' + fmtR(s.saved) + '</div></div></div>' +
    '<div class="tier mt"><div class="badge ' + pts.tier.name + '">' + pts.tier.emoji + '</div><div><div class="strong">' + pts.tier.name + ' · ' + pts.total + ' points</div><div class="small muted">' +
    (s.budgeted ? (s.spent <= s.budgeted ? '🎯 You stayed within budget!' : 'Over budget by ' + fmtR(s.spent - s.budgeted) + ' — this month is a clean slate.') : '') + '</div></div></div>' +
    (r && r.reward > 0 ? '<div class="nudge gold" style="cursor:default"><div class="e">🎉</div><div><div class="t">' + fmtR(r.reward) + ' added to your Reward Pot</div><div class="small muted">' + r.pct + '% of your ' + fmtR(r.surplus) + ' surplus. Move the other ' + fmtR(r.surplus - r.reward) + ' to savings if you haven\'t yet.</div></div></div>'
      : s.income > 0 ? '<div class="nudge" style="cursor:default"><div class="e">🌱</div><div><div class="t">No surplus this time</div><div class="small muted">Spending matched or passed income. One small change this month makes a difference.</div></div></div>'
      : '<div class="nudge" style="cursor:default"><div class="e">💡</div><div><div class="t">Log your income this month</div><div class="small muted">The Reward Pot fills from income minus spending, so record payday.</div></div></div>') +
    (state.household.carryOver !== false ? '<p class="small mt">↪️ <b>' + fmtR(carryIn(nextPeriodStart(sh.p))) + '</b> brought forward into ' + esc(periodName(nextPeriodStart(sh.p))) + ' — give it a job on the Budget tab.</p>' : '') +
    '<p class="small mt">Tiers reset today. Everyone starts at Bronze — first check-in earns points.</p><button class="btn primary block" data-act="closeSheet">Let\'s go 🚀</button>';
};

function checkRecap(){
  if (!state.household) return;
  var cur = currentPeriod();
  if (device.lastRecap === cur) return;
  var prev = prevPeriodStart(cur), had = periodSummary(prev).txs.length > 0;
  device.lastRecap = cur; saveDevice();
  if (had && !ui.sheet) { openSheet('recap', {p:prev}); confetti(); }
}

function init(){
  loadAll();
  if (migrateCategories()) saveState(); // one-off move to groups with categories inside; syncs to the other devices
  if (device.autoSync == null) device.autoSync = !IS_IOS;
  var r = Drive.handleRedirect();
  rcResume();
  render();
  if (Relay.ready()) {
    if (state.household || device.joining) runSync(false);
  } else if (r === 'ok') {
    runSync(false).then(function(){ if (device.driveFileId && !device.syncError) toast('☁️ Connected to Google Drive'); });
  } else if (state.household && device.driveFileId) {
    if (Drive.tokenValid()) runSync(false);
    else if (device.autoSync && !IS_IOS && r !== 'silent-fail' && navigator.onLine !== false) {
      var tried = null; try { tried = sessionStorage.getItem('nestegg-silent'); } catch(e){}
      if (!tried) { try { sessionStorage.setItem('nestegg-silent', '1'); } catch(e){} Drive.signIn(true); return; }
    }
  }
  checkRecap();
  if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
    // updateViaCache 'none': always ask GitHub for a new sw.js, so a new version is noticed straight away
    var hadWorker = !!navigator.serviceWorker.controller;
    navigator.serviceWorker.register('sw.js', {updateViaCache:'none'}).then(function(reg){
      document.addEventListener('visibilitychange', function(){ if (document.visibilityState === 'visible') reg.update().catch(function(){}); });
    }).catch(function(e){ console.warn('SW', e); });
    // a new version took over while the app was open: reload into it, unless you're in the middle of something
    navigator.serviceWorker.addEventListener('controllerchange', function(){
      if (!hadWorker) return;
      if (!ui.sheet && !ui.view) location.reload();
      else toast('Nestegg was updated — close and reopen it to use the new version');
    });
  }
  var lastDay = todayStr();
  document.addEventListener('visibilitychange', function(){
    if (document.visibilityState !== 'visible') return;
    if (todayStr() !== lastDay) { lastDay = todayStr(); if (!ui.sheet) softRender(); checkRecap(); }
    if (state.household && (Relay.ready() || (device.driveFileId && Drive.tokenValid()))) runSync(false);
  });
  window.addEventListener('online', function(){ if (Relay.ready() || device.dirty) runSync(false); });
  // with automatic sync, pick up the other phone's entries while the app stays open
  setInterval(function(){ if (document.visibilityState === 'visible' && state.household && Relay.ready()) runSync(false); }, 90000);
}
init();

})();
</script>
</body>
</html>
