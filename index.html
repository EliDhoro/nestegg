<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nestegg</title>
<meta name="description" content="Our household budget — check in daily, earn rewards, grow our nest egg.">
<meta name="theme-color" content="#1f6b4f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Nestegg">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
:root{
  --bg:#f5f2ea; --surface:#ffffff; --surface-2:#efebe0; --ink:#1d2420; --ink-2:#5b645f; --ink-3:#8b928d;
  --line:#e2ddd0; --brand:#1f6b4f; --brand-2:#2f8a66; --brand-soft:#dcefe5; --gold:#d99a1e; --gold-soft:#fbefd2;
  --danger:#c2412d; --danger-soft:#f8e1dc; --blue:#2d6cb5; --blue-soft:#dde9f7; --purple:#7b4fc2; --purple-soft:#ebe3f8;
  --shadow:0 1px 2px rgba(20,30,25,.06),0 4px 14px rgba(20,30,25,.06); --radius:18px;
  --nav-h:68px; color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#111613; --surface:#1a211d; --surface-2:#232c27; --ink:#eef2ef; --ink-2:#aab4ae; --ink-3:#7c8781;
    --line:#2c3631; --brand:#4fbf8f; --brand-2:#6fd3a7; --brand-soft:#1e3b2f; --gold:#f0b43c; --gold-soft:#3a2f17;
    --danger:#f07a66; --danger-soft:#3d221d; --blue:#7fb0ec; --blue-soft:#1d2b3d; --purple:#b596ef; --purple-soft:#2c2340;
    --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#111613; --surface:#1a211d; --surface-2:#232c27; --ink:#eef2ef; --ink-2:#aab4ae; --ink-3:#7c8781;
  --line:#2c3631; --brand:#4fbf8f; --brand-2:#6fd3a7; --brand-soft:#1e3b2f; --gold:#f0b43c; --gold-soft:#3a2f17;
  --danger:#f07a66; --danger-soft:#3d221d; --blue:#7fb0ec; --blue-soft:#1d2b3d; --purple:#b596ef; --purple-soft:#2c2340;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  -webkit-font-smoothing:antialiased;min-height:100vh;overscroll-behavior-y:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
a{color:var(--brand)}
.hidden{display:none!important}
#app{max-width:1000px;margin:0 auto;padding:0 16px calc(var(--nav-h) + 28px + env(safe-area-inset-bottom));min-height:100vh}
.topbar{display:flex;align-items:center;gap:12px;padding:calc(14px + env(safe-area-inset-top)) 0 10px}
.topbar h1{font-size:22px;margin:0;flex:1;letter-spacing:-.01em}
.topbar .sub{font-size:13px;color:var(--ink-2);font-weight:500}
.iconbtn{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--surface);box-shadow:var(--shadow);font-size:18px;position:relative}
.iconbtn .dot{position:absolute;top:7px;right:7px;width:8px;height:8px;border-radius:50%;background:var(--gold)}
.avatar{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--brand-soft);color:var(--brand);font-weight:700;font-size:16px}
.grid{display:grid;gap:14px}
@media(min-width:820px){.grid.two{grid-template-columns:1fr 1fr}.span2{grid-column:1/-1}}
.card{background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px}
.card h2,.card h3{margin:0 0 10px;font-size:16px;letter-spacing:-.005em}
.card h2 .muted,.card h3 .muted{font-weight:500}
.row{display:flex;align-items:center;gap:10px}
.row.between{justify-content:space-between}
.wrap{flex-wrap:wrap}
.muted{color:var(--ink-2)}
.small{font-size:13px}
.tiny{font-size:12px}
.strong{font-weight:700}
.right{text-align:right}
.center{text-align:center}
.mt{margin-top:12px}.mt2{margin-top:20px}.mb{margin-bottom:12px}
.big-num{font-size:34px;font-weight:800;letter-spacing:-.02em;line-height:1.1}
.mid-num{font-size:22px;font-weight:750;letter-spacing:-.01em}
.pos{color:var(--brand)} .neg{color:var(--danger)}
.hero{background:linear-gradient(140deg,var(--brand) 0%,#164e3a 100%);color:#fff}
:root[data-theme="dark"] .hero{background:linear-gradient(140deg,#1f6b4f,#123a2c)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .hero{background:linear-gradient(140deg,#1f6b4f,#123a2c)}}
.hero .muted{color:rgba(255,255,255,.78)}
.hero .bar{background:rgba(255,255,255,.22)}
.hero .bar>i{background:#fff}
.bar{height:10px;border-radius:99px;background:var(--surface-2);overflow:hidden;position:relative}
.bar>i{display:block;height:100%;border-radius:99px;background:var(--brand);transition:width .4s ease}
.bar.warn>i{background:var(--gold)} .bar.over>i{background:var(--danger)}
.bar.thin{height:6px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:99px;font-size:12px;font-weight:650;background:var(--surface-2);color:var(--ink-2)}
.pill.gold{background:var(--gold-soft);color:#8a5b00}
:root[data-theme="dark"] .pill.gold{color:var(--gold)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .pill.gold{color:var(--gold)}}
.pill.green{background:var(--brand-soft);color:var(--brand)}
.pill.red{background:var(--danger-soft);color:var(--danger)}
.pill.blue{background:var(--blue-soft);color:var(--blue)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 18px;border-radius:14px;font-weight:650;
  background:var(--surface-2);color:var(--ink);transition:transform .08s ease,opacity .2s}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--brand);color:#fff}
:root[data-theme="dark"] .btn.primary{color:#0d1a14}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn.primary{color:#0d1a14}}
.btn.gold{background:var(--gold);color:#2b1d00}
.btn.ghost{background:transparent;color:var(--brand)}
.btn.danger{background:var(--danger-soft);color:var(--danger)}
.btn.block{width:100%}
.btn.sm{min-height:36px;padding:0 12px;border-radius:11px;font-size:14px}
.btn[disabled]{opacity:.45;pointer-events:none}
.btns{display:flex;gap:10px;flex-wrap:wrap}
.btns>.btn{flex:1}
label.field{display:block;margin:12px 0}
label.field>span{display:block;font-size:13px;color:var(--ink-2);margin-bottom:6px;font-weight:600}
.input,select.input,textarea.input{width:100%;min-height:46px;padding:10px 12px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);outline:none;font-size:16px}
.input:focus{border-color:var(--brand)}
textarea.input{min-height:80px;resize:vertical}
.seg{display:flex;background:var(--surface-2);border-radius:14px;padding:4px;gap:4px}
.seg button{flex:1;min-height:40px;border-radius:11px;font-weight:650;font-size:14px;color:var(--ink-2)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:12px;padding:11px 2px;border-bottom:1px solid var(--line)}
.li:last-child{border-bottom:0}
.li .ico{width:40px;height:40px;border-radius:12px;background:var(--surface-2);display:grid;place-items:center;font-size:19px;flex:none}
.li .main{flex:1;min-width:0}
.li .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .s{font-size:12.5px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .amt{font-weight:700;white-space:nowrap}
.li.tap{cursor:pointer}
.date-h{font-size:12px;font-weight:700;color:var(--ink-3);text-transform:uppercase;letter-spacing:.05em;margin:14px 2px 2px}
/* streaks */
.streaks{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.streak{background:var(--surface-2);border-radius:14px;padding:10px 8px;text-align:center}
.streak .n{font-size:24px;font-weight:800;line-height:1.1}
.streak .l{font-size:12px;color:var(--ink-2);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.streak.done{background:var(--gold-soft)}
.streak .f{font-size:11px;color:var(--ink-3)}
.week{display:flex;gap:6px;justify-content:space-between;margin-top:12px}
.week .d{flex:1;text-align:center;font-size:11px;color:var(--ink-3);font-weight:650}
.week .d b{display:block;margin:4px auto 0;width:26px;height:26px;border-radius:50%;background:var(--surface-2);line-height:26px;font-size:13px}
.week .d.ok b{background:var(--gold);color:#2b1d00}
.week .d.fr b{background:var(--blue-soft);color:var(--blue)}
.week .d.today b{outline:2px solid var(--brand);outline-offset:1px}
/* tier */
.tier{display:flex;align-items:center;gap:14px}
.badge{width:60px;height:60px;border-radius:18px;display:grid;place-items:center;font-size:30px;flex:none}
.badge.Bronze{background:#f3e0cf}.badge.Silver{background:#e7eaee}.badge.Gold{background:#fbe9b8}.badge.Diamond{background:#dcecff}
:root[data-theme="dark"] .badge{filter:saturate(.8) brightness(.8)}
.nudge{display:flex;gap:12px;align-items:flex-start;padding:12px;border-radius:14px;background:var(--surface-2);margin-top:10px;cursor:pointer}
.nudge .e{font-size:22px;line-height:1}
.nudge .t{font-weight:650}
.nudge.gold{background:var(--gold-soft)} .nudge.green{background:var(--brand-soft)} .nudge.blue{background:var(--blue-soft)}
/* nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);
  padding:6px 8px calc(6px + env(safe-area-inset-bottom));display:flex;justify-content:center}
.nav .in{display:flex;width:100%;max-width:560px;justify-content:space-around;align-items:center}
.nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:650;color:var(--ink-3);padding:6px 0;min-height:52px}
.nav button .i{font-size:21px;line-height:1;filter:grayscale(1);opacity:.75}
.nav button.on{color:var(--brand)}
.nav button.on .i{filter:none;opacity:1}
.nav .add{flex:none;width:60px;height:60px;border-radius:20px;background:var(--brand);color:#fff;font-size:32px;font-weight:400;
  display:grid;place-items:center;margin:-22px 6px 0;box-shadow:0 6px 18px rgba(31,107,79,.35);min-height:0}
.nav .add.pop{animation:genie-pop .3s ease}
@keyframes genie-pop{40%{transform:scale(1.18)}}
/* swiping a sheet away: it pours into the + (03b-genie.js) */
#genie{position:fixed;inset:0;z-index:60;pointer-events:none;overflow:hidden}
.genie-strip{position:absolute;left:0;top:0;overflow:hidden;transform-origin:0 0;will-change:transform;contain:strict}
.genie-strip .sheet{position:absolute;left:0;margin:0;max-width:none;max-height:none;overflow:hidden;animation:none;visibility:visible}
/* sheet */
.overlay{position:fixed;inset:0;background:rgba(10,15,12,.45);z-index:50;display:flex;align-items:flex-end;justify-content:center;animation:fade .15s ease}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:94vh;overflow:auto;border-radius:24px 24px 0 0;
  padding:10px 16px calc(18px + env(safe-area-inset-bottom));animation:up .22s cubic-bezier(.2,.8,.2,1);overscroll-behavior:contain}
@media(min-width:820px){.overlay{align-items:center}.sheet{border-radius:24px;max-height:90vh}}
.sheet .grab{width:42px;height:5px;border-radius:9px;background:var(--line);margin:0 auto 10px}
.sheet h2{margin:4px 0 12px;font-size:19px}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}
/* add */
.amount-display{text-align:center;font-size:44px;font-weight:800;letter-spacing:-.02em;padding:6px 0 2px;min-height:62px}
.amount-display .cur{font-size:26px;color:var(--ink-3);margin-right:4px;font-weight:700}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:8px 0 12px}
.keypad button{min-height:52px;border-radius:14px;background:var(--surface);font-size:22px;font-weight:650;box-shadow:var(--shadow)}
.keypad button:active{background:var(--surface-2)}
.cats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
@media(min-width:480px){.cats{grid-template-columns:repeat(5,1fr)}}
.cat{display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 4px;border-radius:14px;background:var(--surface);border:2px solid transparent;font-size:11.5px;font-weight:600;color:var(--ink-2);text-align:center;line-height:1.15}
.cat .e{font-size:22px}
.cat.on{border-color:var(--brand);color:var(--ink);background:var(--brand-soft)}
/* group squares in the add sheet: tinted per group (inline hsla), emoji on top */
.gtiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
@media(min-width:480px){.gtiles{grid-template-columns:repeat(4,1fr)}}
@media(min-width:820px){.gtiles{grid-template-columns:repeat(5,1fr)}}
.gtile{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:86px;padding:8px 4px;border-radius:18px;background:var(--surface);
  border:2px solid transparent;color:var(--ink);font-size:12.5px;font-weight:650;line-height:1.15;text-align:center;transition:transform .08s}
.gtile:active{transform:scale(.96)}
.gtile .e{font-size:30px;line-height:1}
.gtile .s{font-size:10.5px;font-weight:700;color:var(--brand);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gtile.on{border-color:var(--brand)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{padding:8px 12px;border-radius:99px;background:var(--surface);border:1.5px solid var(--line);font-size:14px;font-weight:600}
.chip.on{border-color:var(--brand);background:var(--brand-soft);color:var(--brand)}
/* toast */
#toasts{position:fixed;left:0;right:0;top:calc(12px + env(safe-area-inset-top));z-index:90;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none}
.toast{background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:14px;font-weight:650;font-size:14.5px;box-shadow:0 8px 24px rgba(0,0,0,.2);animation:up .25s ease;max-width:92vw}
.toast.gold{background:var(--gold);color:#2b1d00}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:95}
/* onboarding */
.ob{max-width:520px;margin:0 auto;padding-top:calc(30px + env(safe-area-inset-top))}
.logo{width:76px;height:76px;border-radius:24px;background:var(--brand);display:grid;place-items:center;font-size:40px;margin:10px auto 14px;box-shadow:0 10px 30px rgba(31,107,79,.3)}
.ob h1{text-align:center;font-size:28px;margin:0 0 6px;letter-spacing:-.02em}
.ob p.lead{text-align:center;color:var(--ink-2);margin:0 0 24px}
.steps{display:flex;gap:6px;justify-content:center;margin:0 0 18px}
.steps i{width:28px;height:5px;border-radius:9px;background:var(--line)}
.steps i.on{background:var(--brand)}
.choice{display:flex;gap:14px;align-items:center;padding:16px;border-radius:16px;background:var(--surface);box-shadow:var(--shadow);margin-bottom:10px;text-align:left;width:100%}
.choice .e{font-size:28px}
.choice .t{font-weight:700}
.choice .s{font-size:13px;color:var(--ink-2)}
/* table */
.tbl-wrap{overflow:auto;max-height:55vh;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
table.tbl{border-collapse:collapse;width:100%;font-size:13.5px}
.tbl th{position:sticky;top:0;background:var(--surface-2);text-align:left;padding:8px;font-size:12px;color:var(--ink-2);z-index:1}
.tbl td{padding:6px 8px;border-top:1px solid var(--line);vertical-align:middle}
.tbl td.desc{max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tbl select{min-height:34px;padding:4px 6px;font-size:13px;border-radius:9px;border:1px solid var(--line);background:var(--surface);max-width:150px}
.tbl tr.off td{opacity:.4}
.tbl tr.flag td{background:var(--gold-soft)}
/* chart */
.chart svg{width:100%;height:auto;display:block}
.chart .axis{stroke:var(--line)}
.chart .ln{stroke:var(--brand);stroke-width:2.5;fill:none}
.chart .ar{fill:var(--brand-soft);opacity:.8}
.chart text{fill:var(--ink-3);font-size:10px}
.checklist .ci{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--line)}
.checklist .ci:last-child{border-bottom:0}
.checklist input{width:22px;height:22px;accent-color:var(--brand);flex:none;margin-top:1px}
.empty{text-align:center;color:var(--ink-2);padding:22px 8px}
.empty .e{font-size:36px;display:block;margin-bottom:6px}
.sep{height:1px;background:var(--line);margin:14px 0}
.goal-emoji{font-size:26px}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.kpi{background:var(--surface-2);border-radius:14px;padding:10px}
.kpi .l{font-size:12px;color:var(--ink-2);font-weight:600}
.kpi .v{font-weight:800;font-size:17px;letter-spacing:-.01em}
.hero .kpi{background:rgba(255,255,255,.12)}
.hero .kpi .l{color:rgba(255,255,255,.8)}
.toggle{position:relative;width:48px;height:28px;flex:none}
.toggle input{opacity:0;width:0;height:0}
.toggle span{position:absolute;inset:0;border-radius:99px;background:var(--line);transition:.2s}
.toggle span:before{content:"";position:absolute;width:22px;height:22px;left:3px;top:3px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.toggle input:checked+span{background:var(--brand)}
.toggle input:checked+span:before{transform:translateX(20px)}
.code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px;background:var(--surface-2);padding:2px 6px;border-radius:6px;word-break:break-all}

.sticky-save{position:sticky;bottom:calc(-18px - env(safe-area-inset-bottom));background:var(--bg);padding:10px 0 calc(10px + env(safe-area-inset-bottom));margin-top:12px;z-index:2}
.tbl.imp td.desc{max-width:none;width:100%}
.tbl.imp td.desc>div{white-space:nowrap;max-width:40vw}
@media(min-width:700px){.tbl.imp td.desc>div{max-width:420px}}
.tbl.imp select{display:block;width:118px;max-width:118px}
.keypad button{min-height:48px}
.cats{grid-template-columns:repeat(5,1fr);gap:6px}
.cat{padding:6px 2px;font-size:10.5px}
.cat .e{font-size:20px}
.amount-display{font-size:40px;min-height:54px;padding:2px 0}
@media(max-height:700px){.keypad button{min-height:42px;font-size:20px}.keypad{gap:6px}}
.grid>*{min-width:0}
.hero .row.between{flex-wrap:wrap;row-gap:6px}
.kpi{min-width:0}
.kpi .v{overflow-wrap:anywhere}
@media(max-width:380px){.kpi .v{font-size:15px}.big-num{font-size:30px}}

/* receipt review: name across the top, then amount · line · remove */
.ritem{display:grid;grid-template-columns:96px 1fr auto;gap:6px;padding:8px 0;border-bottom:1px solid var(--line)}
.ritem input:first-child{grid-column:1 / -1}
.ritem .input{min-height:38px;font-size:14px}
.ritem .ramt{text-align:right}
.spinner{width:36px;height:36px;margin:0 auto;border-radius:50%;border:4px solid var(--line);border-top-color:var(--brand);animation:spin .9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

</style>
</head>
<body>
<div id="app"><p style="padding:40px;text-align:center">Loading…</p></div>
<div id="nav-root"></div>
<div id="sheet-root"></div>
<div id="toasts"></div>
<input type="file" accept="image/*" id="receipt-file" data-change="receiptFile" hidden>
<canvas id="confetti"></canvas>
<noscript><p style="padding:20px">Nestegg needs JavaScript switched on.</p></noscript>
<script>
(function(){'use strict';
/* ===== Nestegg — core: config, utils, state, storage, merge ===== */
var CONFIG = {
  // Paste your Google OAuth Client ID here (see README step 3). Can also be set per device in Settings.
  GOOGLE_CLIENT_ID: '337695640575-5fcs07dqha9lh9q24e7qejib21rci1j7.apps.googleusercontent.com',
  APP_NAME: 'Nestegg',
  DATA_FILE: 'nestegg-household-data.json',
  VERSION: '1.0.0',
  BUILD: '20261030154831' // set by tools/build.py

/* ---------- per-month category amounts ---------- */

function txBetween(a, b){

}

/* ---------- check-ins & streaks ---------- */

    live('tx').forEach(function(t){ if (t.createdOn && t.memberId && map[t.memberId]) map[t.memberId][t.createdOn] = true; });
    live('checkins').forEach(function(c){ if (map[c.memberId]) map[c.memberId][c.date] = true; });

}

  return memo('first', function(){

}

  var guard = 0;
  for (; d < t && guard < 4000; d = addDays(d, 1), guard++) {
    if (isDone(d)) {

      if (r.streak % 7 === 0) { r.freezes = Math.min(2, r.freezes + 1); r.milestones[d] = r.streak; }
    } else if (r.streak > 0 && r.freezes > 0) { r.freezes--; r.frozen[d] = true; }
    else r.streak = 0;
    r.best = Math.max(r.best, r.streak);
  }
  if (isDone(t)) {
    r.today = true; r.streak++;
    if (r.streak % 7 === 0) { r.freezes = Math.min(2, r.freezes + 1); r.milestones[t] = r.streak; }

/* ---------- points & tiers ---------- */
function tierFor(points){
  var t = TIERS[0];

  return t;
}

  return null;
}

    var items = [], total = 0;
    function add(label, pts, e){ if (pts > 0) { items.push({label:label, pts:pts, e:e}); total += pts; } }
    var ms = members();
    ms.forEach(function(m){
      var n = 0, d;
      for (d = start; d <= last; d = addDays(d, 1)) if (didCheckIn(m.id, d)) n++;
      add('Daily check-ins · ' + m.name + ' (' + n + ' day' + (n===1?'':'s') + ')', n * 10, '🔥');
      var st = memberStreak(m.id), bonus = 0;
      Object.keys(st.milestones).forEach(function(k){ if (k >= start && k <= end) bonus += 30; });
      add('Streak milestones · ' + m.name, bonus, '⭐');
    });
    if (ms.length > 1) {
      var c = 0, d2;
      for (d2 = start; d2 <= last; d2 = addDays(d2, 1)) if (bothCheckedIn(d2)) c++;
      add('Both checked in (' + c + ' day' + (c===1?'':'s') + ')', c * 5, '💞');
    }

      if (x.date < began) return; // history from before you started doesn't earn points
      if (x.type === 'skip') skipPts += Math.min(50, Math.floor((+x.amount||0) / 10));
      if (x.type === 'saving') {
        savePts += Math.min(100, Math.floor((+x.amount||0) / 20));

      }
    });
    live('tx').forEach(function(x){ if (x.source === 'import' && x.createdOn >= start && x.createdOn <= end) imported = true; });
    add('Skipped purchases', skipPts, '💪');
    add('Money moved to savings', savePts, '🏦');
    add('Paid yourselves first (saved in first 5 days)', early * 25, '🚀');
    var md = live('moneyDates').filter(function(x){ return x.date >= start && x.date <= end; }).length;
    add('Money dates (' + md + ')', md * 50, '☕');

    var reached = live('goals').filter(function(g){ return g.reachedOn && g.reachedOn >= start && g.reachedOn <= end; }).length;
    add('Goals reached', reached * 100, '🏆');

/* ---------- Reward Pot ---------- */
function rewardPct(tierName){ var p = state.household && state.household.rewardPct || {}; return +p[tierName] || 0; }

function rewardFor(start){

function rewardHistory(){
  return memo('rh', function(){
    var cur = currentPeriod(), first = null;

/* ---------- money brought forward (the old sheet's "Balance B/D") ---------- */

}
// Money actually in hand this month: brought forward + income received − spent − saved (Reward Pot spending comes from the pot)
function inHand(start){

  return memo('pot', function(){
    var earned = sum(rewardHistory(), function(r){ return r.reward; });

/* ---------- totals for wealth ---------- */
function totalSkipped(){ return sum(live('tx').filter(function(x){ return x.type === 'skip'; }), function(x){ return x.amount; }); }

function goalPace(g){

function latestNetWorth(){
  var a = live('netWorth').sort(function(x,y){ return x.date < y.date ? -1 : 1; });

/* ===== Nestegg — UI infrastructure: render loop, events, toasts, confetti, sheets ===== */
var ui = {tab:'home', view:null, period:null, sheet:null, ob:{step:0}, actFilter:{q:'', type:'all', who:'all'}, imp:null};
var ACTIONS = {}, CHANGES = {}, INPUTS = {};

function render(keepScroll){

  var app = $('#app');
  var y = window.scrollY;
  if (!state.household) app.innerHTML = viewOnboarding();
  else app.innerHTML = viewMain();
  $('#nav-root').innerHTML = state.household && !ui.view ? viewNav() : '';

// A background sync redraws the screen: never while someone is typing, and without losing what's in a form
function softRender(){
  var a = document.activeElement;
  function typing(el){ return /^(INPUT|TEXTAREA|SELECT)$/.test(el.tagName) && !/^(file|checkbox|radio)$/.test(el.type); }
  if (a && typing(a)) return;
  var kept = $all('#app [id], #sheet-root [id]').filter(typing).map(function(el){ return {id:el.id, v:el.value}; });
  render(true);
  kept.forEach(function(k){ var el = document.getElementById(k.id); if (el && el.value !== k.v) el.value = k.v; });

  var t = document.createElement('div');
  t.className = 'toast' + (kind ? ' ' + kind : '');
  t.textContent = msg;

}
function buzz(ms){ try { if (navigator.vibrate) navigator.vibrate(ms || 12); } catch(e){} }

function confetti(){
  var c = $('#confetti'); if (!c || !c.getContext) return;
  var ctx = c.getContext('2d'), W = c.width = window.innerWidth, H = c.height = window.innerHeight;
  var colors = ['#1f6b4f','#d99a1e','#4fbf8f','#f0b43c','#2d6cb5','#c2412d'];
  var ps = [];
  for (var i=0;i<110;i++) ps.push({x:W/2 + (Math.random()-.5)*80, y:H*0.35, vx:(Math.random()-.5)*12, vy:-Math.random()*13-4,
    s:Math.random()*7+4, r:Math.random()*6, vr:(Math.random()-.5)*.3, c:colors[i%colors.length]});
  var frames = 0;
  (function tick(){
    ctx.clearRect(0,0,W,H);
    ps.forEach(function(p){ p.vy += .38; p.x += p.vx; p.y += p.vy; p.r += p.vr; p.vx *= .99;
      ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.r); ctx.fillStyle = p.c; ctx.fillRect(-p.s/2,-p.s/4,p.s,p.s/2); ctx.restore(); });

  })();
}

function download(filename, text, mime){

}

/* Celebrate changes: compare snapshot before/after an action */

  if (a.tier !== before.tier && a.pts > before.pts) { setTimeout(function(){ toast('🎉 You reached ' + a.tier + ' tier!', 'gold'); }, 600); confetti(); }
  else if (a.streak !== before.streak && a.streak > 0 && a.streak % 7 === 0) { confetti(); toast('⭐ ' + a.streak + '-day streak! You earned a streak freeze', 'gold'); }

/* ===== Nestegg — swipe a sheet away: it pours down into the + button (the Genie effect) ===== */
// The sheet is cut into thin strips, each a copy showing one slice. Every strip is then moved and narrowed on its own,
// following the finger, so the sheet funnels into the +. Only transforms change, so it stays smooth on old phones.
// The shape and timing are taken frame by frame from the owner's recording of the macOS Genie effect (see genieDraw).
var genie = null, swipe = null;
function clamp01(t){ return t < 0 ? 0 : t > 1 ? 1 : t; }
function smooth(t){ return t * t * (3 - 2 * t); }
function genieTarget(r){
  var add = $('.nav .add'), b = add && add.getBoundingClientRect();
  if (b && b.width) return {x:b.left + b.width / 2, y:b.top + b.height * 0.3, w:b.width * 0.62};
  return {x:r.left + r.width / 2, y:window.innerHeight - 8, w:38}; // no + on this screen: towards the bottom
}
// A copy of an element for one strip. Anything outside the strip's slice becomes an empty box of the same size, which keeps
// the layout but makes each strip far lighter: copying the whole sheet 36 times froze slow phones for over a second.
// What was typed shows, nothing can be tapped, and no ids or radio groups end up duplicated in the page.
function genieCopy(el, top, bottom, boxes){
  var c = el.cloneNode(false), name = el.tagName;
  c.removeAttribute('id'); c.removeAttribute('name');
  if (name === 'INPUT' && el.type !== 'file') {
    if (el.type === 'radio' || el.type === 'checkbox') { if (el.checked) c.setAttribute('checked', ''); else c.removeAttribute('checked'); }
    else c.setAttribute('value', el.value);
  }
  if (name === 'OPTION' && el.selected) c.setAttribute('selected', '');
  for (var k = el.firstChild; k; k = k.nextSibling) {
    if (k.nodeType !== 1) { c.appendChild(k.cloneNode(false)); continue; }
    var b = boxes.get(k);
    if (b && (b.b < top || b.t > bottom)) {
      var box = k.cloneNode(false);
      box.removeAttribute('id'); box.removeAttribute('name');
      box.style.cssText += ';visibility:hidden;box-sizing:border-box;width:' + b.w + 'px;height:' + b.h + 'px;flex:none';
      c.appendChild(box);
    } else c.appendChild(genieCopy(k, top, bottom, boxes));
  }
  return c;
}
function genieStart(sheet){
  var r = sheet.getBoundingClientRect(), tg = genieTarget(r), overlay = sheet.parentNode;
  var g = {sheet:sheet, overlay:overlay, x0:r.left, y0:r.top, w:r.width, h:r.height, tx:tg.x, ty:tg.y, tw:tg.w, strips:[], p:0, lift:0};
  g.plain = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
  genie = g;
  if (g.plain) return g;
  var n = Math.max(14, Math.min(36, Math.round(r.height / 18))), sh = r.height / n, layer = document.createElement('div');
  var boxes = new Map();
  $all('*', sheet).forEach(function(el){ var b = el.getBoundingClientRect(); boxes.set(el, {t:b.top, b:b.bottom, w:b.width, h:b.height}); });
  layer.id = 'genie'; g.layer = layer; g.n = n; g.sh = sh;
  for (var i = 0; i < n; i++) {
    var strip = document.createElement('div'), copy = genieCopy(sheet, r.top + i * sh - 2, r.top + (i + 1) * sh + 3, boxes);
    strip.className = 'genie-strip'; strip.style.width = r.width + 'px'; strip.style.height = (sh + 1) + 'px'; // 1px overlap: no seams
    copy.style.top = (-i * sh) + 'px'; copy.style.width = r.width + 'px'; copy.style.height = r.height + 'px';
    strip.appendChild(copy); layer.appendChild(strip); g.strips.push(strip);
  }
  document.body.appendChild(layer);
  if (sheet.scrollTop) $all('.genie-strip > .sheet', layer).forEach(function(c){ c.scrollTop = sheet.scrollTop; });
  genieDraw(g, 0);
  sheet.style.visibility = 'hidden';
  return g;
}
// p: 0 = the whole sheet, 1 = gone into the +. As in the recording:
// first the bottom pinches into a neck while the top stays put, with the sides a bell (wide, then curving in low down);
// the pinch climbs until they're a trumpet (a thin neck right below a wide cup);
// then the flat top edge slides down the neck, narrowing as it goes, and each row disappears into the + as it reaches it.
function genieDraw(g, p){
  g.p = p;
  g.overlay.style.opacity = 1 - p * 0.9;
  if (g.plain) { g.sheet.style.transform = 'translateY(' + (p * (g.ty - g.y0) + g.lift) + 'px)'; return; }
  var pinch = smooth(clamp01(p / 0.12)), from = 0.7 * (1 - smooth(clamp01(p / 0.3))), to = 1 - 0.45 * smooth(clamp01(p / 0.35));
  var slide = smooth(clamp01((p - 0.15) / 0.85)), bottom = g.y0 + g.h, end = bottom + (g.ty - bottom) * smooth(clamp01(p / 0.2));
  var top = g.y0 + (g.ty - g.y0) * slide + g.lift * (1 - slide), mouth = g.tw + (g.w - g.tw) * (1 - smooth(clamp01((slide - 0.15) / 0.85)));
  function width(y){
    var u = end > top ? clamp01((y - top) / (end - top)) : 1, f = smooth(clamp01((u - from) / Math.max(0.05, to - from)));
    return g.w + (mouth + (g.tw - mouth) * f - g.w) * pinch;
  }
  function centre(w){ return g.x0 + g.w / 2 + (g.tx - g.x0 - g.w / 2) * (g.w - w) / (g.w - g.tw); }
  var i, y, w, left = [], right = [], ys = [];
  for (i = 0; i <= g.n; i++) ys[i] = Math.min(end, top + i * g.sh);
  for (i = 0; i < g.n; i++) {
    w = width(ys[i]);
    g.strips[i].style.transform = 'translate(' + (centre(w) - w / 2) + 'px,' + ys[i] + 'px) scale(' + (w / g.w) + ',' + Math.max(0.002, (ys[i + 1] - ys[i]) / g.sh) + ')';
  }
  // each strip is a rectangle, so its edges step; one smooth outline over them all trims the steps into the curve
  for (i = 0; i <= 56; i++) {
    y = top + (end - top) * i / 56; w = width(y);
    left.push((centre(w) - w / 2).toFixed(1) + 'px ' + y.toFixed(1) + 'px');
    right.unshift((centre(w) + w / 2).toFixed(1) + 'px ' + y.toFixed(1) + 'px');
  }
  g.layer.style.clipPath = 'polygon(' + left.concat(right).join(',') + ')';
}
function genieEnd(g){
  if (g.layer) g.layer.parentNode.removeChild(g.layer);
  g.sheet.style.visibility = ''; g.sheet.style.transform = ''; g.overlay.style.opacity = '';
  genie = null;
}
// Runs p to where it needs to go; the timer finishes the job even if the phone stops drawing frames
function genieRun(g, to, ms, then){
  var from = g.p, start = null, finished = false;
  function finish(){ if (finished) return; finished = true; genieEnd(g); then(); }
  function frame(ts){
    if (finished) return;
    if (start === null) start = ts;
    var t = clamp01((ts - start) / ms);
    g.lift *= 0.8;
    genieDraw(g, from + (to - from) * (to ? t : 1 - (1 - t) * (1 - t)));
    if (t < 1) requestAnimationFrame(frame); else finish();
  }
  requestAnimationFrame(frame);
  setTimeout(finish, ms + 250);
}
// Scanned items take work to get back, so they're worth one question; everything else just goes
function genieMayLeave(){
  var sh = ui.sheet;
  return !(sh && sh.type === 'receipt' && sh.items && sh.items.length) || confirmBox('Leave without saving this receipt?');
}
function genieLeave(g){
  var sh = ui.sheet, typed = sh && sh.type === 'add' && !sh.editId && sh.amount;
  genieRun(g, 1, 100 + 480 * (1 - g.p), function(){
    closeSheet(); buzz(10);
    var add = $('.nav .add');
    if (add) { add.classList.add('pop'); setTimeout(function(){ add.classList.remove('pop'); }, 320); }
    if (typed) toast('Not saved');
  });
}
// Out of the + when it opens a sheet: the same movement in reverse
function genieOpen(){
  var sheet = $('.sheet');
  if (!sheet || genie || !$('.nav .add')) return;
  sheet.style.animation = 'none';
  var g = genieStart(sheet);
  if (g.plain) { genieEnd(g); return; }
  genieDraw(g, 1);
  genieRun(g, 0, 470, function(){});
}
function genieClose(){
  var sheet = $('.sheet');
  if (!sheet || genie || !genieMayLeave()) return;
  if (document.activeElement) document.activeElement.blur();
  genieLeave(genieStart(sheet));
}
function swipeBegin(target, x, y){
  var sheet = target.closest && target.closest('.sheet');
  if (!sheet || genie || sheet.parentNode.id === 'genie') return;
  // a list inside the sheet, or the sheet itself, scrolls back to the top before a swipe can close it
  for (var el = target; el && el !== sheet.parentNode; el = el.parentNode) if (el.scrollTop > 0) return;
  swipe = {sheet:sheet, x:x, y:y, on:false, ly:y, lt:Date.now(), v:0};
}
function swipeMove(x, y, ev){
  if (!swipe) return;
  var dy = y - swipe.y, dx = x - swipe.x;
  if (!swipe.on) {
    if (dy < -8 || (Math.abs(dx) > 14 && Math.abs(dx) > dy)) { swipe = null; return; } // scrolling or sideways chips
    if (dy < 12) return;
    swipe.on = true; swipe.y = y; dy = 0;
    if (document.activeElement) document.activeElement.blur();
    genieStart(swipe.sheet);
  }
  if (ev.cancelable) ev.preventDefault();
  var t = Date.now(), g = genie; if (!g) return;
  if (t > swipe.lt) { swipe.v = (y - swipe.ly) / (t - swipe.lt); swipe.ly = y; swipe.lt = t; }
  swipe.d = dy;
  g.lift = Math.max(0, dy) * 0.2;
  genieDraw(g, Math.min(0.8, Math.max(0, dy) / (g.ty - g.y0) * 1.15));
}
function swipeEnd(ev){
  var s = swipe; swipe = null;
  if (!s || !s.on) return;
  if (ev && ev.cancelable) ev.preventDefault(); // the finger lifting mustn't also press a key
  var g = genie; if (!g) return;
  var go = (s.d || 0) > Math.min(130, g.h * 0.22) || ((s.d || 0) > 50 && s.v > 0.6);

document.addEventListener('touchstart', function(ev){ if (ev.touches.length === 1) swipeBegin(ev.target, ev.touches[0].clientX, ev.touches[0].clientY); else swipe = null; }, {passive:true});

document.addEventListener('touchend', swipeEnd, {passive:false});
document.addEventListener('touchcancel', function(){ swipeEnd(); });
// on a PC: drag the little handle at the top of the sheet
document.addEventListener('mousedown', function(ev){ if (ev.target.classList && ev.target.classList.contains('grab')) { swipeBegin(ev.target, ev.clientX, ev.clientY); ev.preventDefault(); } });
document.addEventListener('mousemove', function(ev){ if (swipe) swipeMove(ev.clientX, ev.clientY, ev); });
document.addEventListener('mouseup', function(ev){ if (swipe) swipeEnd(ev); });

function txIcon(t){
  if (t.type === 'income') return '💰';
  if (t.type === 'saving') { var g = t.goalId && byId('goals', t.goalId); return g ? g.emoji : '🏦'; }
  if (t.type === 'skip') return '💪';
  if (t.type === 'ignore') return '↔️';
  if (t.type === 'adjust') return '⚖️';
  return cat(t.categoryId).emoji;
}
function txTitle(t){
  if (t.note) return t.note;
  if (t.type === 'income') return 'Income';
  if (t.type === 'saving') { var g = t.goalId && byId('goals', t.goalId); return g ? 'Saved for ' + g.name : 'Moved to savings'; }
  if (t.type === 'skip') return 'Skipped a purchase';
  if (t.type === 'ignore') return 'Transfer (not counted)';
  if (t.type === 'adjust') return 'Balance adjustment';
  return cat(t.categoryId).name;
}
function txAmount(t){
  var a = +t.amount || 0;
  if (t.type === 'income') return '<span class="amt pos">+' + fmtRc(a) + '</span>';
  if (t.type === 'saving') return '<span class="amt" style="color:var(--blue)">' + fmtRc(a) + '</span>';
  if (t.type === 'skip') return '<span class="amt" style="color:var(--gold)">' + fmtRc(a) + '</span>';
  if (t.type === 'ignore') return '<span class="amt muted">' + (t.dir === 'in' ? '+' : t.dir === 'out' ? '−' : '') + fmtRc(a) + '</span>';
  if (t.type === 'adjust') return '<span class="amt muted">' + (a >= 0 ? '+' : '') + fmtRc(a) + '</span>';
  if (a < 0) return '<span class="amt pos">+' + fmtRc(-a) + '</span>'; // refund
  return '<span class="amt">−' + fmtRc(a) + '</span>';
}
function methodName(m){ var x = null; METHODS.forEach(function(k){ if (k[0] === m) x = k[1]; }); return x; }
function txRow(t){
  var m = member(t.memberId), parts = [];
  if (t.type === 'expense' && t.note) parts.push(cat(t.categoryId).name);
  if (t.type === 'expense' && t.amount < 0) parts.push('↩️ refund');
  if (t.splitId) parts.push('✂️ split');
  if (t.type === 'skip') parts.push('not spent');
  if (t.method) parts.push(methodName(t.method));
  if (accounts().length > 1) { var ac = account(txAccountId(t)); if (ac) parts.push(ac.name); }
  if (m) parts.push(m.name);

}

function nudges(){
  var out = [], p = currentPeriod(), s = periodSummary(p), d = new Date();
  if (!live('tx').length) out.push({e:'📄', t:'Bring in your bank statements', s:'Import FNB or GoTyme statements to see where your money really goes.', act:'view', id:'import', cls:'blue'});
  if (s.income === 0) out.push({e:'💰', t:'Payday? Log your income', s:'Record what came in so every rand can get a job.', act:'addType', id:'income', cls:'green'});
  if (s.budgeted === 0) out.push({e:'📊', t:'Set up your budget', s:'Give each category a monthly amount.', act:'tab', id:'budget', cls:'gold'});
  else if (s.incomeBase > 0 && s.leftToAssign > 0) out.push({e:'🧩', t:fmtR(s.leftToAssign) + ' has no job yet', s:'Give every rand a job — budget it or save it.', act:'tab', id:'budget', cls:'gold'});
  else if (s.leftToAssign < 0 && s.incomeBase > 0) out.push({e:'⚖️', t:'Budget is ' + fmtR(-s.leftToAssign) + ' more than income', s:'Trim a category so the plan balances.', act:'tab', id:'budget', cls:'gold'});
  if (s.savingsTarget > 0 && s.saved < s.savingsTarget && s.dayIndex <= 7) out.push({e:'🚀', t:'Pay yourselves first', s:'Move ' + fmtR(s.savingsTarget - s.saved) + ' to savings now for bonus points.', act:'addType', id:'saving', cls:'green'});
  var wk = weekKey(todayStr()), mdDone = live('moneyDates').some(function(x){ return x.id === 'md-' + wk; });

}

function lineChart(pts){
  if (pts.length < 2) return '<p class="small muted">Add another snapshot next month to see your trend.</p>';
  var W = 320, H = 120, P = 18, vs = pts.map(function(p){ return p.v; }), mn = Math.min.apply(null, vs), mx = Math.max.apply(null, vs);
  if (mx === mn) { mx += 1; mn -= 1; }
  function x(i){ return P + i * (W - 2*P) / (pts.length - 1); }
  function y(v){ return H - P - (v - mn) / (mx - mn) * (H - 2*P); }
  var d = pts.map(function(p, i){ return (i ? 'L' : 'M') + x(i).toFixed(1) + ' ' + y(p.v).toFixed(1); }).join(' ');
  var area = d + ' L' + x(pts.length-1).toFixed(1) + ' ' + (H-P) + ' L' + P + ' ' + (H-P) + ' Z';
  return '<svg viewBox="0 0 ' + W + ' ' + H + '"><line class="axis" x1="' + P + '" x2="' + (W-P) + '" y1="' + (H-P) + '" y2="' + (H-P) + '"/>' +
    '<path class="ar" d="' + area + '"/><path class="ln" d="' + d + '"/>' +
    pts.map(function(p, i){ return '<circle cx="' + x(i).toFixed(1) + '" cy="' + y(p.v).toFixed(1) + '" r="3.5" fill="var(--brand)"/>'; }).join('') +
    '<text x="' + P + '" y="' + (H-3) + '">' + esc(pts[0].label) + '</text><text x="' + (W-P) + '" y="' + (H-3) + '" text-anchor="end">' + esc(pts[pts.length-1].label) + '</text></svg>';
}

function parseAmount(s){
  if (s == null) return NaN;
  s = String(s).replace(/[R\s ]/gi, '');
  if (s.indexOf(',') >= 0 && s.indexOf('.') >= 0) s = s.replace(/,/g, '');
  else if (s.indexOf(',') >= 0) s = /,\d{1,2}$/.test(s) ? s.replace(',', '.') : s.replace(/,/g, '');
  var n = parseFloat(s);
  return isNaN(n) ? NaN : round2(n);
}

// Works out each line's amount: at most one line may be left empty and gets whatever remains of the total
function splitResolve(sh){
  var total = parseAmount(sh.amount) || 0, empty = [], filled = 0, bad = false;
  sh.split.forEach(function(r, i){
    if (!String(r.amount).trim()) empty.push(i);
    else { var v = parseAmount(r.amount); if (!(v > 0)) bad = true; else filled += v; }
  });
  var rest = round2(total - filled);
  return {total:total, empty:empty, filled:round2(filled), rest:rest, bad:bad};
}
function splitStatus(sh){
  var r = splitResolve(sh);
  if (!r.total) return 'Enter the total first';
  if (r.empty.length === 1) return r.rest > 0 ? 'The empty line gets ' + fmtRc(r.rest) : '<span class="neg">Lines already use the whole total</span>';
  if (r.rest === 0) return '✅ All split';
  return r.rest > 0 ? fmtRc(r.rest) + ' still to split' : '<span class="neg">' + fmtRc(-r.rest) + ' more than the total</span>';
}

function pressKey(k){
  var sh = ui.sheet; if (!sh || sh.type !== 'add') return;
  var a = sh.amount || '';
  if (k === '⌫') a = a.slice(0, -1);
  else if (k === '.') { if (a.indexOf('.') < 0) a = (a || '0') + '.'; }
  else {
    if (a.indexOf('.') >= 0 && a.split('.')[1].length >= 2) return;
    if (a.replace('.', '').length >= 9) return;
    a = (a === '0' ? '' : a) + k;
  }
  sh.amount = a; var el = $('#amt'); if (el) el.innerHTML = amountHtml(a); buzz(6);
  var sl = $('#split-left'); if (sl && sh.split) sl.innerHTML = splitStatus(sh);
}
ACTIONS.key = function(el){ pressKey(el.getAttribute('data-k')); };
document.addEventListener('keydown', function(ev){
  if (!ui.sheet || ui.sheet.type !== 'add') { if (ev.key === 'Escape' && ui.sheet) closeSheet(); return; }
  var tag = (ev.target.tagName || '').toLowerCase();
  if (ev.key === 'Escape') { closeSheet(); return; }
  if (tag === 'input' || tag === 'textarea' || tag === 'select') { if (ev.key === 'Enter' && tag === 'input') ACTIONS.addSave(); return; }
  if (/^[0-9]$/.test(ev.key)) { pressKey(ev.key); ev.preventDefault(); }
  else if (ev.key === '.' || ev.key === ',') { pressKey('.'); ev.preventDefault(); }
  else if (ev.key === 'Backspace') { pressKey('⌫'); ev.preventDefault(); }
  else if (ev.key === 'Enter') { ACTIONS.addSave(); ev.preventDefault(); }
});
ACTIONS.addSave = function(){
  var sh = ui.sheet, amount = parseAmount(sh.amount);
  if (!(amount > 0)) { toast('Enter an amount'); return; }
  var isExp = sh.txType === 'expense', sign = isExp && sh.refund ? -1 : 1, lines = null;
  if (isExp && sh.split) {
    var r = splitResolve(sh);
    if (r.bad) { toast('Check the line amounts'); return; }
    if (sh.split.some(function(x){ return !x.categoryId; })) { toast('Pick a line for every row'); return; }
    if (r.empty.length > 1) { toast('Leave at most one amount empty'); return; }
    if (r.empty.length === 1 && !(r.rest > 0)) { toast('Nothing is left for the empty line'); return; }
    if (!r.empty.length && r.rest !== 0) { toast(r.rest > 0 ? fmtRc(r.rest) + ' still to split' : 'The lines add up to more than the total'); return; }
    lines = sh.split.map(function(x){ return {categoryId:x.categoryId, amount: String(x.amount).trim() ? parseAmount(x.amount) : r.rest}; });
  } else if (isExp && !sh.categoryId) { toast('Pick a category'); return; }
  var before = snapshot();
  var orig = sh.editId ? byId('tx', sh.editId) : null, oldIds = sh.editIds || (orig ? [orig.id] : []);
  if (!lines) lines = [{categoryId:(isExp || sh.txType === 'skip') ? (sh.categoryId || 'c-other') : null, amount:amount}];
  var splitId = lines.length > 1 ? (sh.splitId || 's-' + uid()) : null, t = null;
  lines.forEach(function(l, i){
    // reuse the receipt's existing records first, so an imported line keeps its bank reference
    var base = oldIds[i] && byId('tx', oldIds[i]);
    var x = base ? Object.assign({}, base) : {id:'t-' + uid(), source:'manual', createdOn:todayStr(), createdAt:now() + i};
    x.type = sh.txType; x.amount = round2(sign * l.amount); x.date = sh.date || todayStr(); x.memberId = sh.memberId || me().id;
    x.note = (sh.note || '').trim(); x.categoryId = l.categoryId; x.splitId = splitId;
    x.goalId = sh.txType === 'saving' ? (sh.goalId || null) : null;
    x.method = (isExp || sh.txType === 'income') ? (sh.method || null) : null;
    if (accounts().length && sh.txType !== 'skip') x.accountId = sh.accountId || defaultAccountFor(x.memberId, x.method);
    if (i === 0 && lines.length === 1 && base && base.raw && base.categoryId !== x.categoryId && isExp) learnRule(base.raw, x.categoryId);
    upsert('tx', x); if (i === 0) t = x;
  });
  oldIds.slice(lines.length).forEach(function(id){ removeItem('tx', id); });
  if (sh.method) { device.lastMethod = sh.method; saveDevice(); }
  var reached = null;
  if (t.goalId) { var g = byId('goals', t.goalId); if (g && !g.reachedOn && goalSaved(g.id) >= g.target) { g = Object.assign({}, g); g.reachedOn = todayStr(); upsert('goals', g); reached = g; } }
  saveState(); closeSheet(); render(true);
  celebrate(before);
  if (reached) { confetti(); setTimeout(function(){ toast('🏆 Goal reached: ' + reached.name + '!', 'gold'); }, 700); }
  if (!orig && lines.length > 1) setTimeout(function(){ toast('✂️ Split across ' + lines.length + ' lines'); }, 400);
  else if (!orig && t.type === 'expense' && t.amount > 0 && t.categoryId !== 'c-reward' && t.date >= currentPeriod()) {
    var c = cat(t.categoryId), s = periodSummary(currentPeriod()), sp = s.byCat[c.id] || 0, b = s.budgets[c.id] || 0;
    if (b > 0) setTimeout(function(){ toast(c.emoji + ' ' + c.name + ': ' + (b - sp >= 0 ? fmtR(b - sp) + ' left' : fmtR(sp - b) + ' over budget')); }, 400);
  }
  if (!orig && t.type === 'skip') setTimeout(function(){ toast('💪 ' + fmtR(t.amount) + ' stayed in your pocket'); }, 400);
};

CHANGES.restoreFile = function(el){

      state = hadHousehold ? mergeStates(state, incoming) : incoming;

function prettyMerchant(desc){
  var s = ' ' + String(desc || '') + ' ';
  s = s.replace(/\b(pos|card|debit|credit|cheque|chq|internet|online|digital|fnb app|banking app|app)\b\s*(purchase|payment|pmt|order|transfer|trf|txn|transaction)s?\b/gi, ' ')
    .replace(/\b(purchase|payment to|payment from|pmt to|paid to|received from|debit order|recurring|scheduled|immediate|instant|eft|magtape|ref:?|reference:?|nedbank|fnb|gotyme|tyme)\b/gi, ' ')
    .replace(/\b\d{2}[\/\-.]\d{2}([\/\-.]\d{2,4})?\b/g, ' ')
    .replace(/[*#]+\s*\d*/g, ' ').replace(/\b\d{4,}\b/g, ' ').replace(/\b[0-9x]{4}\s?[x*]{2,}\S*/gi, ' ')
    .replace(/[^A-Za-z0-9&'@.\- ]+/g, ' ').replace(/\s+/g, ' ').trim();
  if (!s) s = String(desc || '').trim();
  s = s.toLowerCase().replace(/\b[a-z]/g, function(c){ return c.toUpperCase(); });
  return s.slice(0, 40);
}
function merchantKey(desc){ return prettyMerchant(desc).toUpperCase().split(' ').filter(function(w){ return w.length > 1; }).slice(0, 3).join(' '); }
function learnRule(raw, categoryId){
  var k = merchantKey(raw); if (k.length < 3 || !categoryId) return;
  var id = 'r-' + k.replace(/[^A-Z0-9]+/g, '-').toLowerCase();
  upsert('rules', {id:id, pattern:k, categoryId:categoryId});
}
function hasAny(text, words){ for (var i=0;i<words.length;i++) if (text.indexOf(words[i]) >= 0) return true; return false; }
function classify(desc, amt){
  var d = ' ' + String(desc || '').toLowerCase() + ' ', key = merchantKey(desc), up = String(desc || '').toUpperCase();
  var rules = live('rules');
  for (var i=0;i<rules.length;i++) if (key.indexOf(rules[i].pattern) >= 0 || up.indexOf(rules[i].pattern) >= 0) {
    return amt < 0 ? {type:'expense', categoryId:rules[i].categoryId, flag:false} : {type:'income', categoryId:null, flag:false};
  }
  if (amt > 0) {
    if (hasAny(d, INCOME_WORDS)) return {type:'income', categoryId:null, flag:false};
    if (hasAny(d, TRANSFER_WORDS)) return {type:'ignore', categoryId:null, flag:true};
    return {type:'income', categoryId:null, flag:true};
  }
  if (hasAny(d, SAVING_WORDS)) return {type:'saving', categoryId:null, flag:true};
  for (var k=0;k<KEYWORDS.length;k++) if (hasAny(d, KEYWORDS[k][1])) return {type:'expense', categoryId:byId('categories', KEYWORDS[k][0]) ? KEYWORDS[k][0] : 'c-other', flag:!byId('categories', KEYWORDS[k][0])};
  if (hasAny(d, ['transfer','trf'])) return {type:'expense', categoryId:'c-other', flag:true};
  return {type:'expense', categoryId:'c-other', flag:true};
}

var MON = {jan:0,feb:1,mar:2,apr:3,may:4,jun:5,jul:6,aug:7,sep:8,sept:8,oct:9,nov:10,dec:11};
function mkDate(y, m, d){
  if (y < 100) y += 2000;
  if (m < 0 || m > 11 || d < 1 || d > 31 || y < 1990 || y > 2100) return null;
  var dt = new Date(y, m, d); if (dt.getMonth() !== m) return null;
  return d2s(dt);
}
function parseDateAny(s, yearHint){
  if (!s) return null; s = String(s).trim().replace(/^['"]|['"]$/g, '');
  var m;
  if ((m = s.match(/^(\d{4})[\/\-.](\d{1,2})[\/\-.](\d{1,2})(?:\b|T)/))) return mkDate(+m[1], +m[2]-1, +m[3]);
  if ((m = s.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})\b/))) return mkDate(+m[3], +m[2]-1, +m[1]);
  if ((m = s.match(/^(\d{8})$/))) return mkDate(+m[1].slice(0,4), +m[1].slice(4,6)-1, +m[1].slice(6,8));
  if ((m = s.match(/^(\d{1,2})[\s\-]*([A-Za-z]{3,9})\.?[\s\-,]*(\d{4}|\d{2})?\b/))) {
    var mo = MON[m[2].toLowerCase().slice(0, m[2].toLowerCase() === 'sept' ? 4 : 3)]; if (mo === undefined) return null;
    var y = m[3] ? +m[3] : (yearHint || new Date().getFullYear());
    var r = mkDate(y, mo, +m[1]);
    if (r && !m[3] && r > addDays(todayStr(), 3)) r = mkDate(y - 1, mo, +m[1]);
    return r;
  }
  if ((m = s.match(/^([A-Za-z]{3,9})\.?\s+(\d{1,2}),?\s+(\d{4})\b/))) { var mo2 = MON[m[1].toLowerCase().slice(0,3)]; if (mo2 === undefined) return null; return mkDate(+m[3], mo2, +m[2]); }
  return null;
}
function parseMoney(s, strict){
  if (s == null) return NaN;
  var t = String(s).trim().replace(/ /g, ' ');
  if (!t) return NaN;
  var neg = false;
  if (/^\(.*\)$/.test(t)) { neg = true; t = t.slice(1, -1); }
  var crdr = t.match(/\s*(cr|dr)\.?$/i);
  if (crdr) { if (crdr[1].toLowerCase() === 'dr') neg = true; t = t.slice(0, crdr.index); }
  t = t.replace(/^r\s*/i, '').replace(/\s*r$/i, '');
  if (/^-\s*r?\s*/i.test(t)) { neg = !neg; t = t.replace(/^-\s*r?\s*/i, ''); }
  else if (/-$/.test(t)) { neg = !neg; t = t.slice(0, -1); }
  else if (/^\+/.test(t)) t = t.slice(1);
  t = t.trim();
  if (strict ? !/^\d{1,3}([ ,]?\d{3})*[.,]\d{2}$/.test(t) : !/^\d[\d ,]*([.,]\d{1,2})?$/.test(t)) return NaN;
  if (/[.,]\d{2}$/.test(t)) { var dec = t.slice(-2); t = t.slice(0, -3).replace(/[ ,.]/g, '') + '.' + dec; }
  else t = t.replace(/[ ,]/g, '');
  var n = parseFloat(t); if (isNaN(n)) return NaN;
  return neg ? -n : n;
}
function parseCSV(text){
  text = text.replace(/^﻿/, '');
  var first = text.split(/\r?\n/).slice(0, 20).join('\n');
  var delims = [',', ';', '\t', '|'], best = ',', bestN = 0;
  delims.forEach(function(d){ var n = first.split(d).length; if (n > bestN) { bestN = n; best = d; } });
  var rows = [], row = [], cell = '', q = false;
  for (var i=0;i<text.length;i++) {
    var c = text[i];
    if (q) { if (c === '"') { if (text[i+1] === '"') { cell += '"'; i++; } else q = false; } else cell += c; }

/* ---------- PDF ---------- */
function loadScript(src){

    if (document.querySelector('script[src="' + src + '"]')) { res(); return; }
    var s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = function(){ rej(new Error('Could not load PDF reader — are you online?')); };

          if (err && err.name === 'PasswordException') {

// Reads Google's text of a till slip. It checks itself against the slip's own numbers: the items it keeps must add up

    if (R_PAY.test(l) && !R_DISCOUNT.test(l)) { pays.push(Math.abs(amt)); end = Math.min(end, idx); return; }

  out.items = items.map(function(x){ return {name:x.name, amount:x.amount}; });
  out.total = paid !== null ? round2(paid) : (items.length ? round2(sum(items, function(x){ return x.amount; })) : null);

}

/* ---------- photo → text ---------- */
// Shrinks the photo so it sends quickly on mobile data but stays sharp enough to read (narrow slips keep their width)
function shrinkPhoto(file){
  return new Promise(function(resolve, reject){
    var url = URL.createObjectURL(file), img = new Image();
    img.onload = function(){
      var s = Math.min(1, 1400 / img.width, 3200 / img.height), c = document.createElement('canvas');
      c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
      var g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height); g.drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url); resolve(c.toDataURL('image/jpeg', 0.78).split(',')[1]);
    };
    img.onerror = function(){ URL.revokeObjectURL(url); reject(new Error('That file isn\'t a photo Nestegg can open.')); };
    img.src = url;
  });
}
/* ---------- Google's Gemini AI (optional, through the household's script) ---------- */
// The instructions travel with each photo, so they can be improved here without updating the script.
function aiPrompt(){
  var cats = liveCats().filter(function(c){ return c.group !== 'reward'; }).map(function(c){
    var g = groupsList().filter(function(x){ return x.id === catGroup(c); })[0];
    return c.id + ': ' + (g ? g.name + ' > ' : '') + c.name;
  });
  return 'You read photos of South African till slips and receipts. Reply with JSON only, in this shape: ' +
    '{"store": shop name, "date": "YYYY-MM-DD" or null, "total": the amount actually paid, "method": "card" or "cash" or null, ' +
    '"items": [{"name": the item as printed, "amount": what was paid for that line after any discount on it, "product": the same item in plain standard words, brand then product then size, written the same way every time so it can be matched across shops (for example "Albany Brown Bread 700g" for "ALB BRN BRD 700G"), "qty": how many were bought on that line (1 if not shown; for weighed items 1), "category": one id from the list below}]}. ' +
    'Amounts are rand, as numbers like 12.99. The items must add up to the total. Leave out subtotals, totals, VAT or tax lines, change, cash handed over, ' +
    'card or payment lines, loyalty points and savings summaries, order or transaction numbers, and any faint printing in the background of the paper. ' +
    'A discount or savings line belongs to the item just above it: subtract it from that item. For weighed items and lines like "2 @ 9.99", use the line\'s total. ' +
    'At a restaurant or takeaway every item is eating out. If the photo is not a receipt, reply {"items": []}. Categories (id: group > line):\n' + cats.join('\n');
}
// The AI's answer as review items; the household's own fixes (learned items) still win over the AI's choice of line
function fromAI(ai){
  if (!ai || ai.error || !ai.items || !ai.items.length) return null;
  var store = String(ai.store || '').trim(), items = [];
  ai.items.forEach(function(x){
    var a = round2(+x.amount), name = String(x.name || '').trim() || 'Item';
    if (!(a > 0)) return;
    var key = itemKey(name), learned = null;
    live('itemRules').forEach(function(r){ if (r.pattern === key && existingCat(r.categoryId)) learned = r.categoryId; });
    items.push({name:cleanItemName(name), amount:a, product:String(x.product || '').trim().slice(0, 70), qty:Math.max(1, Math.round(+x.qty) || 1), cat: learned || existingCat(x.category) || classifyItem(name, store)});
  });

  var total = +ai.total > 0 ? round2(+ai.total) : round2(sum(items, function(x){ return x.amount; }));
  return {store:cleanItemName(store), date:/^\d{4}-\d{2}-\d{2}$/.test(ai.date || '') ? ai.date : null, total:total, items:items, ai:true,
    method: ai.method === 'card' || ai.method === 'cash' ? ai.method : null, check: !near(sum(items, function(x){ return x.amount; }), total)};
}

/* ===== Nestegg — accounts, and checking them against the bank (reconciliation) ===== */
// An account ('accounts'): {id, name, emoji, kind:'bank'|'cash', memberId (null = both of you), main (that person's card & EFT account),
//   opening:{date, amount, at}} — the starting point: the balance at the end of `date`.
// Every entry belongs to one account: its accountId, or (older entries) the payer's main bank account, or Cash when paid in cash.
// A check ('recons'): {id, accountId, asOf, on, bank, waiting, nestegg, adjust, by, at}. The entries it covered get reconId;
// entries the bank hasn't shown yet are marked pending and wait for the next check.

function accounts(){
  return memo('accs', function(){ return live('accounts').sort(function(a, b){ return (a.order || 0) - (b.order || 0) || (a.createdAt || 0) - (b.createdAt || 0); }); });
}
function account(id){ var a = id && byId('accounts', id); return a && !a.deleted ? a : null; }
function accountLabel(a){ return (a.emoji || '🏦') + ' ' + a.name; }
function defaultAccountFor(memberId, method){
  return memo('dacc:' + memberId + ':' + method, function(){
    var as = accounts();
    function first(f){ for (var i = 0; i < as.length; i++) if (f(as[i])) return as[i].id; return null; }
    if (method === 'cash') return first(function(a){ return a.kind === 'cash' && a.memberId === memberId; }) || first(function(a){ return a.kind === 'cash'; });
    return first(function(a){ return a.kind !== 'cash' && a.memberId === memberId && a.main; }) || first(function(a){ return a.kind !== 'cash' && a.memberId === memberId; }) ||
      first(function(a){ return a.kind !== 'cash' && !a.memberId; }) || first(function(a){ return a.kind !== 'cash'; });
  });
}
function txAccountId(t){ if (t.type === 'skip') return null; return account(t.accountId) ? t.accountId : defaultAccountFor(t.memberId, t.method); }
// What an entry does to its account's balance (a refund is stored negative, so it comes back in)
function txFlow(t){
  var a = +t.amount || 0;
  if (t.type === 'income' || t.type === 'adjust') return a;
  if (t.type === 'expense') return -a;
  if (t.type === 'saving') return t.dir === 'in' ? a : -a;
  if (t.type === 'ignore') return t.dir === 'in' ? a : t.dir === 'out' ? -a : 0;
  return 0;
}
function cents(v){ return Math.round((+v || 0) * 100); }
// amounts here always keep their cents when there are any: R17 909.50, not R17 910
function fmtM(v){ return fmtR(v, cents(v) % 100 !== 0); }
// Entries after the starting point. On the starting day itself, only what was typed in after the balance was taken.
function inLedger(acc, t){
  var o = acc.opening; if (!o || txAccountId(t) !== acc.id) return false;
  return t.date > o.date || (t.date === o.date && t.source !== 'import' && (t.createdAt || 0) > (o.at || 0));
}
function ledger(acc, asOf){ return live('tx').filter(function(t){ return (!asOf || t.date <= asOf) && inLedger(acc, t); }); }
function bookBalance(acc, asOf){ return round2((acc.opening ? +acc.opening.amount : 0) + sum(ledger(acc, asOf), txFlow)); }
// the last check that balanced (a check saved with a difference still open doesn't count)
function lastRecon(accId){
  var r = live('recons').filter(function(x){ return x.accountId === accId && x.balanced !== false; }).sort(function(a, b){ return (b.at || 0) - (a.at || 0); });
  return r[0] || null;
}
// A split receipt is one payment on the bank: group its lines
function txUnits(list){
  var map = {}, out = [];
  list.forEach(function(t){
    if (t.type === 'skip') return;
    var k = t.splitId || t.id, u = map[k];
    if (!u) { u = map[k] = {id:k, ids:[], flow:0, date:t.date, text:'', t:t}; out.push(u); }
    u.ids.push(t.id); u.flow = round2(u.flow + txFlow(t)); u.text += ' ' + (t.note || '') + ' ' + (t.raw || '');
  });
  return out.filter(function(u){ return u.flow !== 0; });
}
// The entry most likely to be this bank line: same amount and direction, nearest date, shop name in common
function closestUnit(units, line, claimed, days, strict){
  var best = null, bs = 1e9, words = merchantKey(line.desc).split(' ');
  units.forEach(function(u){
    if (claimed[u.id] || cents(u.flow) !== cents(line.amount)) return;
    var dd = Math.abs(daysBetween(u.date, line.date)); if (dd > days) return;
    var txt = u.text.toUpperCase(), hit = words.filter(function(w){ return w.length > 2 && txt.indexOf(w) >= 0; }).length;
    if (strict && !hit && dd > 1) return; // a different shop days apart is a different payment
    var score = dd * 10 - hit * 15;
    if (score < bs) { bs = score; best = u; }
  });
  return best;
}
function signedAmount(s){
  var v = String(s == null ? '' : s).replace(/[−–]/g, '-'), neg = /^\s*-/.test(v) || /\(.*\)/.test(v);
  var n = parseAmount(v.replace(/[-()]/g, ''));
  return isNaN(n) ? NaN : (neg ? -n : n);
}

/* ---------- the accounts list (Wealth → Your accounts) ---------- */
function accountsCard(){
  var as = accounts();
  if (!as.length) return '<div class="card"><h2>🏦 Your accounts</h2><p class="small muted">Check that Nestegg matches your bank: tell it which accounts you have, then compare the balances whenever you like. Any difference is tracked down step by step.</p>' +

    '<button class="btn primary block" data-act="compareBank" style="margin:4px 0 8px">🔎 Check our money — In hand vs all accounts</button>' +
    as.map(accountRow).join('') + '<p class="tiny muted mt">The amount is what Nestegg works out from your entries. Tap an account to compare just that one with the bank.</p></div>';

/* ---------- step 3: finding the difference ---------- */
// Likely reasons, each with a fix. d = bank − Nestegg (after what's still on its way).
function rcHints(c, rc){
  var acc = c.acc, out = [], dC = cents(c.D), cand = c.open.filter(function(t){ return !t.pending; }), seen = {}, F = c.flow || txFlow;
  function push(h){ var k = h.k + (h.t ? h.t.id : ''); if (!seen[k]) { seen[k] = 1; out.push(h); } }
  if (c.household) {
    // the whole household: a payday not logged yet, or money from before the month that isn't brought forward
    var s = c.s;
    incomeLines().forEach(function(l){ var m = member(l.memberId);
      var logged = s.txs.some(function(t){ return t.type === 'income' && t.memberId === l.memberId && cents(t.amount) === cents(l.amount); });
      if (c.D > 0 && !logged && cents(l.amount) === dC) push({k:'inc' + l.id, e:'💰', title:(m ? m.name + '\'s ' : '') + l.name + ' — ' + fmtM(l.amount) + ' not logged?', sub:'It\'s exactly the difference. If it came in, log it as income.', acts:['moneyIn']}); });
    if (c.D > 0 && s.income < s.expectedIncome) push({k:'incomeLeft', e:'💰', title:'Income not all logged', sub:'You expect ' + fmtM(s.expectedIncome) + ' this month and ' + fmtM(s.income) + ' is logged. Log any pay that has come in.', acts:['moneyIn']});
    if (!c.m.carry && c.D > 0) push({k:'bf', e:'↪️', title:'Money from before ' + fmtDate(currentPeriod()) + '?', sub:'Your accounts still hold what was there before this budget month. Set Brought forward to that total and the difference shrinks by the same amount.', acts:['carry']});
  }
  // entries already checked last time have since been changed or deleted
  var lr = !c.household && lastRecon(acc.id);
  if (lr) {
    var was = state.tx.filter(function(t){ var r = t.reconId && byId('recons', t.reconId); return r && r.accountId === acc.id && (t.updatedAt || 0) > (lr.at || 0); });
    var nowChecked = round2((+acc.opening.amount || 0) + sum(ledger(acc).filter(function(t){ return t.reconId; }), txFlow));
    if (cents(nowChecked) !== cents(lr.bank) && was.length) push({k:'changed', e:'✏️', title:'Changed since your last check', sub:'Entries you already checked on ' + fmtDate(lr.on || lr.asOf) + ' were edited or deleted since (' + fmtM(round2(nowChecked - lr.bank)) + ' in total). Were those changes right?', list:was});
  }
  // one entry explains it all
  cand.forEach(function(t){ if (cents(F(t)) === -dC) push({k:'one', t:t, e:'🎯', title:fmtM(Math.abs(F(t))) + ' — ' + txTitle(t) + ' (' + fmtDate(t.date) + ')', sub:'This entry is exactly the difference. Not through ' + bankWord(acc) + ' yet, entered twice, or from another account?', acts:['wait', 'del', 'move']}); });
  // logged as money out when it came in (or the other way round)
  cand.forEach(function(t){ if (t.type !== 'income' && (!c.household || t.type === 'expense') && cents(F(t)) * 2 === -dC) push({k:'flip', t:t, e:'🔁', title:txTitle(t) + ' — ' + fmtM(Math.abs(F(t))), sub:F(t) < 0 ? 'Logged as money out. Was it money coming in (a refund)?' : 'Logged as money in. Did it actually go out?', acts:['flip']}); });
  // a typing slip: two digits swapped, or a 0 too many / too few
  cand.forEach(function(t){
    var a = Math.abs(+t.amount), s = String(cents(a)), opts = [a * 10, a / 10];
    for (var i = 0; i < s.length - 1; i++) if (s[i] !== s[i + 1]) opts.push(+(s.slice(0, i) + s[i + 1] + s[i] + s.slice(i + 2)) / 100);
    opts.forEach(function(b){
      b = round2(b); if (b <= 0 || cents(b) === cents(a)) return;
      var f = F(t), f2 = f * b / a;
      if (cents(f) - cents(f2) === -dC) push({k:'typo', t:t, to:b, e:'⌨️', title:txTitle(t) + ': ' + fmtM(a) + ' or ' + fmtM(b) + '?', sub:'A typing slip would explain the difference exactly.', acts:['amt']});
    });
  });
  // two entries together
  if (!out.some(function(h){ return h.k === 'one'; }) && cand.length <= 250) {
    for (var i = 0; i < cand.length && out.length < 8; i++) for (var j = i + 1; j < cand.length; j++) {
      if (cents(F(cand[i])) + cents(F(cand[j])) === -dC) { push({k:'two', e:'🧩', title:'Two entries add up to the difference', sub:'Not through ' + bankWord(acc) + ' yet?', list:[cand[i], cand[j]], acts:['waitAll']}); break; }
    }
  }
  // logged under another account (or as cash)
  if (!c.household) live('tx').forEach(function(t){
    var other = txAccountId(t);
    if (t.reconId || other === acc.id || t.type === 'skip' || t.date > rc.asOf || t.date <= acc.opening.date) return;
    if (cents(F(t)) === dC) push({k:'move', t:t, e:'🔀', title:txTitle(t) + ' — ' + fmtM(Math.abs(F(t))) + ' (' + fmtDate(t.date) + ')', sub:'It\'s under ' + (other ? account(other).name : 'cash') + '. Was it really ' + acc.name + '?', acts:['here']});
  });
  // entered twice
  for (var a = 0; a < cand.length; a++) for (var b2 = a + 1; b2 < cand.length; b2++) {
    var x = cand[a], y = cand[b2];
    if (x.type === y.type && cents(x.amount) === cents(y.amount) && Math.abs(daysBetween(x.date, y.date)) <= 3 && (!x.splitId || x.splitId !== y.splitId) && (!x.importKey || !y.importKey))
      push({k:'dup', t:y, e:'👯', title:'Entered twice? ' + txTitle(x) + ' — ' + fmtM(Math.abs(+x.amount)), sub:fmtDate(x.date) + ' and ' + fmtDate(y.date) + '. If it\'s the same payment, delete one.', acts:['del']});
  }
  cand.forEach(function(t){ if (t.date > todayStr()) push({k:'future', t:t, e:'📅', title:txTitle(t) + ' is dated ' + fmtDate(t.date), sub:'Dated in the future, so the bank can\'t show it yet.', acts:['wait']}); });
  cand.forEach(function(t){ if (t.type === 'ignore' && !t.dir) push({k:'dir', t:t, e:'↔️', title:'Transfer: ' + txTitle(t) + ' — ' + fmtM(+t.amount), sub:'Nestegg doesn\'t know which way this went, so it isn\'t counted.', acts:['in', 'out']}); });
  // guesses about fees and interest: only without a statement (a statement shows the real lines)
  if (rc.stmt) return out;
  if (acc.kind !== 'cash' && c.D < 0 && c.D >= -350) push({k:'fees', e:'🏦', title:'Bank fees not logged?', sub:'Monthly account fees, card or SMS charges are easy to miss. Add ' + fmtM(-c.D) + ' as bank fees if that\'s it.', acts:['fees']});
  if (acc.kind !== 'cash' && c.D > 0 && c.D <= 150) push({k:'interest', e:'🪙', title:'Interest or a small refund?', sub:'Add ' + fmtM(c.D) + ' as money in if the bank paid you something.', acts:['moneyIn']});
  return out;
}

/* ---------- comparing with a statement, line by line ---------- */
CHANGES.rcFile = function(el){
  var f = el.files && el.files[0]; if (!f) return;
  toast('Reading ' + f.name + '…');
  readStatement(f).then(function(stmt){
    stmtAdd(ui.rc, stmt); rcKeep(); saveState(); render(); window.scrollTo(0, 0);
    if (ui.rc.stmt.closing == null) toast('This statement has no balance column, so only its lines can be matched.');
  }).catch(function(e){ toast(e.message || String(e)); });

function readStatement(f){
  var read = (/\.pdf$/i.test(f.name) || f.type === 'application/pdf') ? pdfLines(f).then(rowsFromPdfLines)
    : f.text().then(function(text){ var rows = parseCSV(text), map = detectColumns(rows); return map ? rowsFromCSV(rows, map) : []; });
  return read.then(function(rows){
    if (!rows.length) throw new Error('No transactions found in ' + f.name + '. For an unusual layout, use Import statements first.');
    var asc = stmtAscending(rows), first = asc ? rows[0] : rows[rows.length - 1], last = asc ? rows[rows.length - 1] : rows[0];
    var dates = rows.map(function(r){ return r.date; }).sort();
    return {name:f.name, rows:rows, start:dates[0], end:dates[dates.length - 1],
      closing:last.bal != null ? last.bal : (rows.closeBal != null ? rows.closeBal : null), opening:first.bal != null ? round2(first.bal - first.amount) : (rows.openBal != null ? rows.openBal : null)};
  });
}
// A statement goes in next to the typed balance. A balance already typed stays in use; an empty box takes the closing balance.
function stmtAdd(rc, st){
  var a = account(rc.id);
  if (!a.opening) {
    if (st.opening == null) throw new Error('This statement doesn\'t show balances, so Nestegg can\'t take a starting point from it. Choose "From the start" or "From today" instead.');
    a = Object.assign({}, a); a.opening = {date:addDays(st.start, -1), amount:st.opening, at:now(), src:'statement'}; upsert('accounts', a); clearCache();
  }
  rc.stmt = rc.stmt ? stmtMerge(rc.stmt, st) : st;
  rc.basis = String(rc.typed || '').trim() ? 'typed' : 'stmt';
  rcApplyBasis(rc); stmtClearPending(rc);
}
// Two statements for one account become one long one; a line on both (they overlap) counts once
function stmtMerge(a, b){
  var seen = {}, rows = a.rows.slice();
  function key(r){ return r.date + '|' + r.amount + '|' + r.desc; }
  a.rows.forEach(function(r){ seen[key(r)] = (seen[key(r)] || 0) + 1; });
  b.rows.forEach(function(r){ if (seen[key(r)] > 0) seen[key(r)]--; else rows.push(r); });
  var later = b.end >= a.end ? b : a, earlier = b.start < a.start ? b : a;
  return {name:a.name + ' + ' + b.name, rows:rows, start:earlier.start, end:later.end, closing:later.closing != null ? later.closing : a.closing, opening:earlier.opening != null ? earlier.opening : a.opening};
}
// Which way the file runs: by its running balance when it has one (several lines can share a date), else by date
function stmtAscending(rows){
  var up = 0, down = 0;
  for (var i = 0; i + 1 < rows.length; i++) {
    var a = rows[i], b = rows[i + 1]; if (a.bal == null || b.bal == null) continue;
    if (Math.abs(b.bal - (a.bal + b.amount)) < 0.02) up++;
    if (Math.abs(a.bal - (b.bal + a.amount)) < 0.02) down++;
  }
  return up !== down ? up > down : rows[0].date <= rows[rows.length - 1].date;
}
// anything matched is through the bank
function stmtClearPending(rc){
  stmtMatch(account(rc.id), rc.stmt).matched.forEach(function(x){ x.ids.forEach(function(id){ var t = byId('tx', id); if (t && t.pending) { t = Object.assign({}, t); t.pending = false; upsert('tx', t); } }); });
}
// A statement that begins before the starting point can't be compared: its lines (and your entries from those days) are left out
function stmtStartNudge(c, rc){
  var st = rc.stmt, o = c.acc.opening; if (!st || st.start > o.date) return '';
  var n = st.rows.filter(function(r){ return r.date <= o.date; }).length;
  return '<div class="card" id="rc-stmtstart" style="border:1.5px solid var(--gold)"><div class="strong">' + n + ' of the statement\'s ' + st.rows.length + ' lines are before your starting point</div>' +
    '<p class="small muted">Your starting point is ' + fmtM(o.amount) + ' at the end of ' + esc(fmtDate(o.date)) + ', so those lines and your entries from those days aren\'t being compared. ' +
    (st.opening != null ? 'Use the balance the statement opened with instead (' + fmtM(st.opening) + ' on the morning of ' + esc(fmtDate(st.start)) + ').</p><button class="btn primary block" data-act="rcUseStmt">Start from this statement</button>'
      : 'This statement doesn\'t show its opening balance, so set the starting point by hand.</p><button class="btn block" data-act="rcOpening">Change the starting point</button>') + '</div>';
}
ACTIONS.rcUseStmt = function(){

ACTIONS.rcNoStmt = function(){ var rc = ui.rc; rc.stmt = null; rc.basis = 'typed'; rcApplyBasis(rc); rcKeep(); render(); };
function stmtMatch(acc, stmt){
  var boundary = acc.opening ? acc.opening.date : '0000-00-00', claimed = {}, counts = {};
  var lines = stmt.rows.map(function(s){ return Object.assign({key:stmtKey(s, counts)}, s); }).filter(function(s){ return s.date > boundary; });
  var units = txUnits(ledger(acc).filter(function(t){ return t.date >= addDays(stmt.start, -7) && t.date <= addDays(stmt.end, 7); }));
  var unitOf = {}, byKey = {};
  units.forEach(function(u){ u.ids.forEach(function(id){ unitOf[id] = u; }); });
  live('tx').forEach(function(t){ if (t.importKey && unitOf[t.id]) byKey[t.importKey] = unitOf[t.id]; });
  var matched = [], missing = [], differ = [];
  // the same bank line imported before, then the same amount within 4 days
  lines.forEach(function(s){ var u = byKey[s.key]; if (u && !claimed[u.id]) { claimed[u.id] = 1; s.unit = u; matched.push(u); } });
  lines.forEach(function(s){ if (s.unit) return; var u = closestUnit(units, s, claimed, 4); if (u) { claimed[u.id] = 1; s.unit = u; matched.push(u); } });
  var extra = units.filter(function(u){ return !claimed[u.id] && u.date >= stmt.start && u.date <= stmt.end; });
  lines.forEach(function(s){
    if (s.unit) return;
    // same shop around the same day, different amount
    var words = merchantKey(s.desc).split(' ').filter(function(w){ return w.length > 2; }), near = null;
    extra.forEach(function(u){ if (!near && !claimed[u.id] && (u.flow < 0) === (s.amount < 0) && Math.abs(daysBetween(u.date, s.date)) <= 3 && u.ids.length === 1 &&
      words.some(function(w){ return u.text.toUpperCase().indexOf(w) >= 0; })) near = u; });
    if (near) { claimed[near.id] = 1; differ.push({s:s, u:near}); } else missing.push(s);
  });
  extra = extra.filter(function(u){ return !claimed[u.id]; });
  return {matched:matched, missing:missing, differ:differ, extra:extra, before:stmt.rows.length - lines.length};
}
function stmtCard(c, rc){
  var m = stmtMatch(c.acc, rc.stmt), html = '<div class="card"><h2>📄 Statement vs Nestegg</h2><p class="small muted">' + rc.stmt.rows.length + ' lines from ' + esc(fmtDate(rc.stmt.start)) + ' to ' + esc(fmtDate(rc.stmt.end, true)) +
    ': <b>' + m.matched.length + ' matched</b>' + (m.before ? ' · ' + m.before + ' before your starting point (ignored)' : '') + '.</p>';
  if (!m.missing.length && !m.differ.length && !m.extra.length) return html + '<p class="small">✅ Every line matches an entry.</p></div>';
  if (m.missing.length) html += '<div class="row between mt"><div class="small strong">On the statement, not in Nestegg (' + m.missing.length + ')</div><button class="btn sm" data-act="rcAddAll">+ Add all</button></div>' +
    m.missing.slice(0, 40).map(function(s){ return '<div class="li"><div class="main"><div class="t">' + esc(prettyMerchant(s.desc)) + '</div><div class="s">' + esc(fmtDate(s.date)) + ' · ' + esc(classifyLabel(s)) + '</div></div>' +
      '<span class="amt ' + (s.amount > 0 ? 'pos' : '') + '">' + (s.amount > 0 ? '+' : '−') + fmtM(Math.abs(s.amount)) + '</span><button class="btn sm" data-act="rcAddLine" data-k="' + esc(s.key) + '">Add</button></div>'; }).join('');
  if (m.differ.length) html += '<div class="small strong mt">Amounts that differ (' + m.differ.length + ')</div>' +
    m.differ.map(function(x){ var t = x.u.t; return '<div class="li"><div class="main"><div class="t">' + esc(txTitle(t)) + '</div><div class="s">Nestegg ' + fmtM(Math.abs(+t.amount)) + ' · statement ' + fmtM(Math.abs(x.s.amount)) + ' on ' + esc(fmtDate(x.s.date)) + '</div></div>' +
      '<button class="btn sm" data-act="rcAmt" data-id="' + t.id + '" data-v="' + Math.abs(x.s.amount) + '">Use ' + fmtM(Math.abs(x.s.amount)) + '</button></div>'; }).join('');
  if (m.extra.length) html += '<div class="row between mt"><div class="small strong">In Nestegg, not on the statement (' + m.extra.length + ')</div><button class="btn sm" data-act="rcWaitAll" data-ids="' + m.extra.map(function(u){ return u.ids.join(' '); }).join(' ') + '">⏳ All not through yet</button></div>' +
    '<p class="tiny muted">Still on its way, from another account, or not real? Fix each one.</p>' +
    m.extra.map(function(u){ var t = u.t; return '<div class="row" style="gap:8px"><button class="chip ' + (t.pending ? 'on' : '') + '" data-act="rcWait" data-id="' + t.id + '" style="flex:none">⏳</button><div style="flex:1;min-width:0">' + txRow(t) + '</div>' +
      '<button class="btn sm ghost" data-act="rcMoveOpen" data-id="' + t.id + '" aria-label="Other account">🔀</button><button class="btn sm ghost" data-act="rcDelTx" data-id="' + t.id + '" aria-label="Delete">🗑</button></div>'; }).join('');
  return html + '</div>';
}

/* ===== Nestegg — smart budget: what you really buy, and a plan that saves the most you can actually keep to ===== */
// The numbers are worked out here, from your own history, so they can be checked and need no connection. Google's AI only adds
// ideas on top and never changes a total. For each line: its usual month (the middle month; the average for lines that come and
// go), how far it can come down (commitments not at all, needs a little, wants more, never past what the level allows and,
// with enough history, towards the months you actually managed), and last month's result (a missed target is eased, a met one tightened).
var SMART_LEVELS = [['gentle', 'Gentle', 0.05, 0.15], ['balanced', 'Balanced', 0.10, 0.30], ['max', 'Maximum', 0.15, 0.45]]; // id, name, most off a need, most off a want
var SMART_KEEP_GROUPS = ['g-faith', 'g-family', 'g-cover', 'g-debt', 'g-kids'];
var SMART_KEEP = ['c-rent', 'c-medaid', 'c-carpay', 'c-carins', 'c-carlicence'];
var SMART_WANT_GROUPS = ['g-fun', 'g-personal'];
var SMART_WANT = ['c-ride', 'c-other', 'c-shopping'];

function smartKind(c){
  var g = catGroup(c), h = state.household || {};
  if ((h.smartLocks || {})[c.id] || catPlan(c, periodKeyFor(currentPeriod())).pct) return 'keep';
  if (SMART_KEEP.indexOf(c.id) >= 0 || SMART_KEEP_GROUPS.indexOf(g) >= 0) return 'keep';
  return SMART_WANT.indexOf(c.id) >= 0 || SMART_WANT_GROUPS.indexOf(g) >= 0 ? 'want' : 'need';
}
// The months to learn from. Nestegg can only see from the first entry on, so a month logged part-way is scaled up to a full one.
function smartMonths(){
  return memo('smartMonths', function(){
    var first = null, t = todayStr(), cur = currentPeriod(), out = [], p = prevPeriodStart(cur), i;
    live('tx').forEach(function(x){ if (x.type === 'expense' && (!first || x.date < first)) first = x.date; });
    if (!first) return out;
    function row(start){
      var s = periodSummary(start), from = first > start ? first : start, to = s.end < t ? s.end : t, cover = daysBetween(from, to) + 1;
